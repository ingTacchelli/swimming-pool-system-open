# =============================================================================
# TIMINGS
#   50ms   UART reception
#   500ms  link watchdog and unanswered commands
#   1s     text refresh
# =============================================================================
# =============================================================================

interval:
  # ---------------------------------------------------------------- reception
  - interval: 50ms
    then:
      - lambda: |-
          while (id(uart_ctrl).available()) {
            uint8_t c;
            if (!id(uart_ctrl).read_byte(&c)) break;
            if (c != '\n' && c != '\r') {
              if (id(rx_buf).length() < 500) id(rx_buf) += (char) c;
              continue;
            }
            std::string msg = id(rx_buf);
            id(rx_buf).clear();
            if (msg.length() < 6) continue;

            size_t st = msg.rfind('*');
            if (st == std::string::npos || st + 2 >= msg.length()) continue;
            uint8_t x = 0;
            for (size_t i = 0; i < st; i++) x ^= (uint8_t) msg[i];
            char chk[4];
            snprintf(chk, sizeof(chk), "%02X", x);
            if (msg.compare(st + 1, 2, chk) != 0) continue;

            auto field = [&](const char *k) -> std::string {
              std::string key = std::string("|") + k + "=";
              size_t p = msg.find(key);
              if (p == std::string::npos) return std::string();
              p += key.length();
              size_t e = msg.find('|', p);
              if (e == std::string::npos || e > st) e = st;
              return msg.substr(p, e - p);
            };
            auto num = [&](const char *k) -> float {
              std::string v = field(k);
              if (v.empty()) return NAN;
              float f = atof(v.c_str());
              return (f <= -998.0f) ? NAN : f;     // -999 = invalid value
            };

            if (msg[0] == 'S') {
              id(g_last_rx) = millis();
              id(g_stale) = false;
              std::string mo = field("mo");
              if (!mo.empty()) id(g_mode) = mo;
              id(g_tv) = num("tv");
              id(g_tc) = num("tc");
              id(g_ph) = num("ph");
              id(g_ps) = num("ps");
              id(g_or) = num("or");
              id(g_os) = num("os");
              id(g_hz) = num("hz");
              id(g_cu) = num("cu");
              id(g_q1) = num("q1");
              id(g_q2) = num("q2");
              id(g_l1) = num("l1");
              id(g_l2) = num("l2");
              id(g_l3) = num("l3");
              id(g_pu) = field("pu") == "1";
              id(g_do) = field("do") == "1";
              id(g_cs) = atoi(field("cs").c_str());
              id(g_al) = atoi(field("al").c_str());
              id(g_f1) = field("f1") == "1";
              id(g_f2) = field("f2") == "1";
              id(g_f3) = field("f3") == "1";
              std::string ev = field("ev");
              if (ev.length() == 4) id(g_ev) = ev;
            } else if (msg[0] == 'A') {
              int n = atoi(field("n").c_str());
              if (n == id(g_cmd_pending)) {
                id(g_cmd_pending) = 0;
                if (field("r") == "ok") id(g_result) = "command executed";
                else id(g_result) = std::string("refused: ") + field("w");
              }
            }
          }

  # ---------------------------------------------------- link watchdog
  - interval: 500ms
    then:
      - lambda: |-
          uint32_t now = millis();
          if (now - id(g_last_rx) > 3000) id(g_stale) = true;
          // command unanswered within 2 s = failed, never assumed done
          if (id(g_cmd_pending) != 0 && now - id(g_cmd_t) > 2000) {
            id(g_cmd_pending) = 0;
            id(g_result) = "no confirmation from the control board";
          }

  # ---------------------------------------------------- text refresh
  # Two measures, both to avoid redrawing more than necessary:
  #
  # 1. only the VISIBLE page is updated. The labels of the other six keep their
  #    text while hidden, and are realigned the moment a page opens, because the
  #    navigation buttons call update_ui right after the page change.
  #
  # 2. every label is rewritten only if its text really changed. Rewriting all of
  #    them on every pass marked a dozen areas for redraw each second: many
  #    useless flushes per second, and it was visible.
  #
  # When the link is down the values stay at the last ones received but the
  # header says so: showing old numbers without saying so would be worse than
  # not showing them.
  - interval: 1s
    then:
      - script.execute: update_ui

# =============================================================================
# DIAGNOSTICS TOWARDS HOME ASSISTANT
# =============================================================================

sensor:
  - platform: uptime
    name: "Panel uptime"
    update_interval: 60s
  - platform: wifi_signal
    name: "Panel Wi-Fi RSSI"
    update_interval: 60s

binary_sensor:
  - platform: template
    name: "Control board link"
    device_class: connectivity
    lambda: 'return !id(g_stale);'

text_sensor:
  - platform: template
    name: "Last command result"
    update_interval: 5s
    lambda: 'return {id(g_result)};'
