# =============================================================================
# SPB Swimming Pool Board - DISPLAY PANEL firmware (ESPHome)
# Waveshare ESP32-S3-Touch-LCD-7B (1024x600, GT911 touch, CH32V003 expander)
#
# Single self-contained file: it includes nothing else.
#
# No predefined display model is used. The Waveshare 1024x600 profiles of
# mipi_rgb are those of the 5" board, which carries a different expander and
# requires it to be configured. The 7B carries a CH32V003, so the panel is
# described pin by pin, with timings verified on the real board.
#
# Seven pages with a navigation bar on the left. The UART protocol was tested
# in both directions with the simulator in firmware/simulator.
#
# GPIO MAP
#   GPIO43/44  UART to the control board, on the 4-pin header H3.
#              GPIO15 and GPIO16 are NOT usable as TTL on this board: they are
#              wired to the SP3485 and form the RS-485 pair (IO15 = RS485_TX,
#              IO16 = RS485_RX in the allocation table of the Waveshare
#              schematic, sheet 1). The only TTL UART brought out is UART0 on
#              GPIO43/44, which goes through U13 (FSUSB42UMX, 2:1 switch) and
#              ends either on the CH343P USB-serial bridge or on header H3,
#              depending on SW1. Keep SW1 on the position that routes the UART
#              to H3.
#   GPIO8/9    I2C (GT911 touch + CH32V003 expander)
#   GPIO4      touch interrupt
#   GPIO5 DE / GPIO46 HSYNC / GPIO3 VSYNC / GPIO7 PCLK
#   red    1, 2, 42, 41, 40
#   green  39, 0, 45, 48, 47, 21
#   blue   14, 38, 18, 17, 10
# =============================================================================

substitutions:
  device_name: "spb-display"
  device_friendly_name: "SPB Pool Panel"

esphome:
  name: ${device_name}
  friendly_name: ${device_friendly_name}
  comment: "SPB pool touch panel"
  min_version: "2025.8.0"

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      # --- RGB panel smoothness ---------------------------------------------
      # Goal: make the LVGL draw buffer fit in internal SRAM. ESPHome tries
      # that by itself, but if it cannot find a contiguous block it falls back
      # to PSRAM, and LVGL then draws on the same bus the panel DMA is reading
      # continuously.
      #
      # This option moves the Wi-Fi and LWIP buffers to PSRAM and frees several
      # tens of KB of internal SRAM. The extra PSRAM traffic is negligible: a
      # few hundred KB/s against about 40 MB/s of panel scanout.
      CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP: "y"
      # Data cache from 32 to 64 KB with a 64-byte line instead of 32: fewer
      # misses on PSRAM accesses. It costs 32 KB of internal SRAM, so it pulls
      # in the opposite direction to the line above: if the log says the
      # internal buffer does not fit, remove this first.
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
  # Do NOT set cpu_frequency: 240MHz -> on this board it prevents boot

psram:
  mode: octal
  # 80 MHz is the maximum: 120 MHz exists only for quad PSRAM, and ESPHome
  # rejects it in octal mode.
  speed: 80MHz

# --- CH32V003 expander: external component -----------------------------------
# Not part of ESPHome. It is third-party code compiled together with the
# firmware, pinned here to a specific commit so that an update of the upstream
# repository cannot change your firmware under your feet.
external_components:
  - source:
      type: git
      url: https://github.com/fuzzybear62/esphome-waveshare_io_ch32v003
      ref: 96fc04c1920a55ee5c2ac68ba826c4fce2abd0e6
    components: [ waveshare_io_ch32v003 ]

logger:
  level: INFO
  # The log MUST go out on the native USB, not on UART0: UART0 (GPIO43/44) is
  # the link to the control board. With the default, ESPHome would put the
  # logger on UART0 and log lines would end up inside the protocol frames, plus
  # a conflict on the same peripheral.
  # With SW1 on H3 the CH343P bridge is disconnected anyway, so the console is
  # read from the other USB-C, the native one (GPIO19/20).
  hardware_uart: USB_SERIAL_JTAG

api:
  encryption:
    key: !secret api_key_display
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 0s
  ap:
    ssid: "SPB-Display-Fallback"
    password: !secret ap_password

captive_portal:

web_server:
  port: 80
  version: 3
  local: true

time:
  - platform: sntp
    id: ora_locale
    timezone: Europe/Rome

# =============================================================================
# PANEL HARDWARE
# =============================================================================

i2c:
  id: bus_i2c
  sda: GPIO8
  scl: GPIO9
  frequency: 400kHz
  scan: true

waveshare_io_ch32v003:
  - id: wave_io
    i2c_id: bus_i2c
    address: 0x24

output:
  - platform: waveshare_io_ch32v003
    id: out_backlight
    waveshare_io_ch32v003_id: wave_io
    inverted: true
    zero_means_zero: true
    safe_pwm_levels:
      min_value: 0
      max_value: 247

light:
  - platform: monochromatic
    name: "Backlight"
    id: backlight
    output: out_backlight
    restore_mode: RESTORE_DEFAULT_ON
    default_transition_length: 200ms

# Fonts are downloaded from Google Fonts at compile time: the machine running
# the build needs internet access. bpp: 4 gives smooth edges at low cost.
font:
  - file: "gfonts://Roboto"
    id: f_value
    size: 48
    bpp: 4
  - file: "gfonts://Roboto"
    id: f_title
    size: 30
    bpp: 4
  - file: "gfonts://Roboto"
    id: f_text
    size: 22
    bpp: 4
  - file: "gfonts://Roboto"
    id: f_small
    size: 17
    bpp: 4

display:
  - platform: rpi_dpi_rgb
    id: screen
    auto_clear_enabled: false
    update_interval: never
    color_order: RGB
    # 30 MHz, which is also the maximum allowed by the component.
    # With this panel's timings the full frame is 1386 x 661 pixel clocks, so
    #   30 MHz -> 30e6 / 916146 = 32.7 Hz
    #   21 MHz -> 22.9 Hz
    # and 23 Hz is clearly visible. The pixel clock is not the bottleneck: the
    # 30 MHz scanout asks about 40 MB/s from an octal PSRAM that delivers well
    # over a hundred. What matters is where LVGL draws, not how fast the panel
    # reads.
    pclk_frequency: 30MHz
    pclk_inverted: true
    dimensions:
      width: 1024
      height: 600
    de_pin:
      number: 5
    hsync_pin:
      number: 46
      ignore_strapping_warning: true
    vsync_pin:
      number: 3
      ignore_strapping_warning: true
    pclk_pin: 7
    hsync_pulse_width: 162
    hsync_back_porch: 152
    hsync_front_porch: 48
    vsync_pulse_width: 45
    vsync_back_porch: 13
    vsync_front_porch: 3
    data_pins:
      red:   [1, 2, 42, 41, 40]
      green: [39, 0, 45, 48, 47, 21]
      blue:  [14, 38, 18, 17, 10]
    reset_pin:
      waveshare_io_ch32v003: wave_io
      number: 3
      mode: OUTPUT

touchscreen:
  - platform: gt911
    id: touch
    i2c_id: bus_i2c
    display: screen
    interrupt_pin: GPIO4
    reset_pin:
      waveshare_io_ch32v003: wave_io
      number: 1
      mode: OUTPUT

# =============================================================================
# UART LINK TO THE CONTROL BOARD
#
#   GPIO43 TX -> RX of the control board (GPIO16 on the control side)
#   GPIO44 RX <- TX of the control board (GPIO15 on the control side)
#   common GND
#   115200 8N1
#
# Both signals come out on the 4-pin header H3:
#   pin 1  3V3      <- output, do NOT power it from outside
#   pin 2  GND
#   pin 3  EX_RXD   = GPIO44, input    <- the other board's TX goes here
#   pin 4  EX_TXD   = GPIO43, output   -> the other board's RX goes here
#
# At power-up the ROM bootloader prints one line on GPIO43 at 115200. It is
# unavoidable and harmless: it does not start with 'S', 'A' or 'C' and the
# checksum discards it anyway.
#
# It receives S frames (status) and A frames (command replies), and sends C
# frames (commands). See docs/uart-protocol.md.
#
# All values live in globals: the LVGL pages only read them. If no valid S
# frame arrives for 3 seconds, g_stale becomes true and the UI says so.
# =============================================================================

uart:
  - id: uart_ctrl
    tx_pin: GPIO43
    rx_pin: GPIO44
    baud_rate: 115200
    data_bits: 8
    parity: NONE
    stop_bits: 1
    rx_buffer_size: 1024

globals:
  - id: rx_buf
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: g_last_rx
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: g_stale
    type: bool
    restore_value: false
    initial_value: 'true'

  # --- plant state received from the control board ---------------------------
  - id: g_mode
    type: std::string
    restore_value: false
    initial_value: '"?"'
  - id: g_tv
    type: float
    restore_value: false
    initial_value: 'NAN'
  - id: g_tc
    type: float
    restore_value: false
    initial_value: 'NAN'
  - id: g_ph
    type: float
    restore_value: false
    initial_value: 'NAN'
  - id: g_ps
    type: float
    restore_value: false
    initial_value: 'NAN'
  - id: g_or
    type: float
    restore_value: false
    initial_value: 'NAN'
  - id: g_os
    type: float
    restore_value: false
    initial_value: 'NAN'
  - id: g_hz
    type: float
    restore_value: false
    initial_value: 'NAN'
  - id: g_cu
    type: float
    restore_value: false
    initial_value: 'NAN'
  - id: g_q1
    type: float
    restore_value: false
    initial_value: 'NAN'
  - id: g_q2
    type: float
    restore_value: false
    initial_value: 'NAN'
  - id: g_l1
    type: float
    restore_value: false
    initial_value: 'NAN'
  - id: g_l2
    type: float
    restore_value: false
    initial_value: 'NAN'
  - id: g_l3
    type: float
    restore_value: false
    initial_value: 'NAN'
  - id: g_pu
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: g_do
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: g_cs
    type: int
    restore_value: false
    initial_value: '0'
  - id: g_al
    type: int
    restore_value: false
    initial_value: '0'
  - id: g_ev
    type: std::string
    restore_value: false
    initial_value: '"0000"'
  - id: g_f1
    type: bool
    restore_value: false
    initial_value: 'true'
  - id: g_f2
    type: bool
    restore_value: false
    initial_value: 'true'
  - id: g_f3
    type: bool
    restore_value: false
    initial_value: 'true'

  # --- outgoing commands -----------------------------------------------------
  - id: g_cmd_n
    type: int
    restore_value: false
    initial_value: '0'
  - id: g_cmd_pending
    type: int
    restore_value: false
    initial_value: '0'
  - id: g_cmd_t
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: g_result
    type: std::string
    restore_value: false
    initial_value: '""'

  # --- local panel settings ----------------------------------------------------
  # Not plant state: they live only here and are used to compose the command to
  # send. The control board remains the only one that decides.
  - id: g_hz_set
    type: float
    restore_value: false
    initial_value: '42.0f'
  - id: g_jog_s
    type: int
    restore_value: false
    initial_value: '10'

script:
  # Sends a command and waits for the ack. The outcome goes to g_result, which the
  # UI shows: "sent...", "done", or the rejection reason.
  - id: send_command
    mode: queued
    parameters:
      cmd: string
      val: string
    then:
      - lambda: |-
          if (id(g_stale)) {
            id(g_result) = "link down: command not sent";
            return;
          }
          id(g_cmd_n) = (id(g_cmd_n) % 999) + 1;
          id(g_cmd_pending) = id(g_cmd_n);
          id(g_cmd_t) = millis();
          id(g_result) = "command sent, waiting for confirmation";

          char body[120];
          snprintf(body, sizeof(body), "C|n=%d|c=%s|v=%s|",
                   id(g_cmd_n), cmd.c_str(), val.c_str());
          uint8_t x = 0;
          for (const char *p = body; *p; p++) x ^= (uint8_t) *p;
          char out[140];
          snprintf(out, sizeof(out), "%s*%02X\n", body, x);
          id(uart_ctrl).write_str(out);
          ESP_LOGI("link", "sent: %s", body);
      - script.execute: update_ui

  # Highlights the menu entry of the open page.
  - id: select_page
    mode: single
    parameters:
      idx: int
    then:
      - lambda: |-
          lv_obj_t *b[7] = { id(nav0), id(nav1), id(nav2), id(nav3),
                             id(nav4), id(nav5), id(nav6) };
          for (int i = 0; i < 7; i++) {
            lv_obj_set_style_bg_color(b[i],
              lv_color_hex(i == idx ? 0x2C3846 : 0x141A21), LV_PART_MAIN);
          }
      - script.execute: update_ui

  # Updates all texts. See the long note at the end of the file.
  - id: update_ui
    mode: single
    then:
      - lambda: |-
          // c[] = text cache, cc[] = colour cache. Every label has its own fixed
          // index: the k bases are chosen with margin so that adding a label to
          // one page does not shift the others. An index shared by two pages
          // would be a silent bug: the second label would never be updated.
          static std::string c[64];
          static int cc[8] = { -1, -1, -1, -1, -1, -1, -1, -1 };
          int k = 0;

          auto put = [&](lv_obj_t *o, const std::string &v) {
            if (v != c[k]) { c[k] = v; lv_label_set_text(o, v.c_str()); }
            k++;
          };
          auto col = [](lv_obj_t *o, int slot, int rgb) {
            if (cc[slot] == rgb) return;
            cc[slot] = rgb;
            lv_obj_set_style_text_color(o, lv_color_hex(rgb), LV_PART_MAIN);
          };
          auto f1 = [](float v, const char *fmt, const char *vuoto) {
            if (isnan(v)) return std::string(vuoto);
            char b[48]; snprintf(b, sizeof(b), fmt, v); return std::string(b);
          };

          char b[96];
          const int VERDE = 0x4CAF7D, ROSSO = 0xE05252,
                    AMBRA = 0xE0A252, GRIGIO = 0x8A97A6, BIANCO = 0xFFFFFF;

          // ============ header and status bar: always =====================
          std::string m = id(g_mode);
          std::string modo = "selector ?";
          if (m == "A") modo = "selector AUTO";
          else if (m == "M") modo = "selector MANUAL";
          else if (m == "0") modo = "selector ZERO";
          put(id(lbl_mode), modo);

          if (id(g_al) == 1) snprintf(b, sizeof(b), "1 active alarm");
          else snprintf(b, sizeof(b), "%d active alarms", id(g_al));
          put(id(lbl_alarms), std::string(b));
          col(id(lbl_alarms), 0, id(g_al) > 0 ? ROSSO : GRIGIO);

          put(id(lbl_link), id(g_stale) ? std::string("link down")
                                        : std::string("link up"));
          col(id(lbl_link), 1, id(g_stale) ? ROSSO : VERDE);

          put(id(lbl_result), id(g_result));

          // recurring values, computed once
          std::string s_ph  = f1(id(g_ph), "%.2f", "--");
          std::string s_ps  = f1(id(g_ps), "secondary %.2f", "secondary --");
          std::string s_or  = f1(id(g_or), "%.0f", "--");
          std::string s_os  = f1(id(g_os), "secondary %.0f", "secondary --");
          std::string s_tv  = f1(id(g_tv), "%.1f C", "--");
          std::string s_tc  = f1(id(g_tc), "cell %.1f C", "cell --");
          std::string s_hz  = !id(g_pu) ? std::string("stopped")
                                        : f1(id(g_hz), "%.1f Hz", "--");
          snprintf(b, sizeof(b), "flow %.1f   cell %.1f  m3/h",
                   isnan(id(g_q1)) ? 0.0f : id(g_q1),
                   isnan(id(g_q2)) ? 0.0f : id(g_q2));
          std::string s_port = b;
          snprintf(b, sizeof(b), "%.0f%%   %.0f%%   %.0f%%",
                   isnan(id(g_l1)) ? 0.0f : id(g_l1),
                   isnan(id(g_l2)) ? 0.0f : id(g_l2),
                   isnan(id(g_l3)) ? 0.0f : id(g_l3));
          std::string s_liv = b;
          std::string s_gal = "floats: ";
          s_gal += id(g_f1) ? "ok  " : "EMPTY  ";
          s_gal += id(g_f2) ? "ok  " : "EMPTY  ";
          s_gal += id(g_f3) ? "ok" : "EMPTY";
          snprintf(b, sizeof(b), "%s   -   permissives %d of 13",
                   id(g_do) ? "enabled" : "blocked", id(g_cs));
          std::string s_dos = b;

          std::string ev = id(g_ev);
          while (ev.length() < 4) ev += '0';

          // ================= only the page actually visible ================
          // k restarts from a fixed base for each page, so every label always
          // uses the same cache cell even when the page changes.

          if (id(page_home)->is_showing()) {
            k = 8;
            put(id(lbl_ph), s_ph);
            put(id(lbl_ph2), s_ps);
            put(id(lbl_orp), s_or);
            put(id(lbl_orp2), s_os);
            put(id(lbl_temp), s_tv);
            put(id(lbl_temp2), s_tc);
            put(id(lbl_hz), s_hz);
            put(id(lbl_flow), s_port);
            put(id(lbl_levels), s_liv);
            put(id(lbl_floats), s_gal);
            put(id(lbl_dosing), s_dos);
            col(id(lbl_dosing), 2, id(g_do) ? VERDE : AMBRA);
            std::string e = "EV  ";
            for (int i = 0; i < 4; i++) {
              e += (i ? "   " : "");
              e += std::to_string(i + 1);
              e += ev[i] == '1' ? ": open" : ": closed";
            }
            put(id(lbl_ev_home), e);

          } else if (id(page_filtration)->is_showing()) {
            k = 20;
            put(id(lbl_f_state), id(g_pu) ? std::string("running")
                                          : std::string("stopped"));
            col(id(lbl_f_state), 3, id(g_pu) ? VERDE : GRIGIO);
            put(id(lbl_f_corrente), f1(id(g_cu), "current %.1f A", "current --"));
            put(id(lbl_f_hz), f1(id(g_hz), "%.1f Hz", "--"));
            snprintf(b, sizeof(b), "setpoint %.1f Hz", id(g_hz_set));
            put(id(lbl_f_set), std::string(b));
            put(id(lbl_f_flow), s_port);

          } else if (id(page_chemistry)->is_showing()) {
            k = 26;
            put(id(lbl_c_ph), s_ph);
            put(id(lbl_c_ps), s_ps);
            put(id(lbl_c_or), s_or);
            put(id(lbl_c_os), s_os);
            put(id(lbl_c_tv), s_tv);
            put(id(lbl_c_tc), s_tc);
            put(id(lbl_c_dosing), s_dos);
            col(id(lbl_c_dosing), 6, id(g_do) ? VERDE : AMBRA);
            snprintf(b, sizeof(b), "%d second pulse", id(g_jog_s));
            put(id(lbl_c_jog), std::string(b));

          } else if (id(page_valves)->is_showing()) {
            k = 35;
            lv_obj_t *le[4] = { id(lbl_ev1), id(lbl_ev2), id(lbl_ev3), id(lbl_ev4) };
            for (int i = 0; i < 4; i++)
              put(le[i], ev[i] == '1' ? std::string("open")
                                      : std::string("closed"));

          } else if (id(page_alarms)->is_showing()) {
            k = 40;
            put(id(lbl_a_num), std::to_string(id(g_al)));
            col(id(lbl_a_num), 4, id(g_al) > 0 ? ROSSO : VERDE);
            snprintf(b, sizeof(b), "%d su 13", id(g_cs));
            put(id(lbl_a_cs), std::string(b));
            put(id(lbl_a_do), id(g_do) ? std::string("dosing enabled")
                                       : std::string("dosing blocked"));
            put(id(lbl_a_float), s_gal);
            put(id(lbl_a_link), id(g_stale) ? std::string("stale data")
                                            : std::string("data up to date"));
            col(id(lbl_a_link), 5, id(g_stale) ? ROSSO : VERDE);
            snprintf(b, sizeof(b), "last frame %lu ms ago",
                     (unsigned long) (millis() - id(g_last_rx)));
            put(id(lbl_a_age), std::string(b));

          } else if (id(page_maintenance)->is_showing()) {
            k = 48;
            float lv[3] = { id(g_l1), id(g_l2), id(g_l3) };
            lv_obj_t *lb[3] = { id(lbl_m_l1), id(lbl_m_l2), id(lbl_m_l3) };
            lv_obj_t *bb[3] = { id(bar_l1), id(bar_l2), id(bar_l3) };
            for (int i = 0; i < 3; i++) {
              float v = isnan(lv[i]) ? 0.0f : lv[i];
              lv_bar_set_value(bb[i], (int) v, LV_ANIM_OFF);
              put(lb[i], f1(lv[i], "%.0f%%", "--"));
            }
            snprintf(b, sizeof(b), "last frame %lu ms ago   -   %s",
                     (unsigned long) (millis() - id(g_last_rx)),
                     id(g_stale) ? "STALE" : "up to date");
            put(id(lbl_m_diag), std::string(b));

          } else if (id(page_commands)->is_showing()) {
            k = 54;
            put(id(lbl_k_result), id(g_result).empty()
                                 ? std::string("no command sent")
                                 : id(g_result));
            put(id(lbl_k_mode), modo);
          }

# =============================================================================
# LVGL USER INTERFACE - seven pages
#
# The navigation bar, the header and the status bar are in the top_layer: a
# single layer drawn above all the pages, so they exist once instead of seven
# times. The layer itself is transparent and does not intercept touch; only its
# children do, i.e. the left column and the seven buttons. If the touch ever
# stops responding on the pages, this is the first place to look.
#
# Geometry: column 0..190, content 214..1000, header y 18, status bar y 566.
# Pages use the band y 56..556.
# =============================================================================

lvgl:
  displays:
    - screen
  touchscreens:
    - touch
  # 12% = one eighth of the screen, the smallest buffer ESPHome accepts: the
  # value is rounded to 1/1, 1/2, 1/4 or 1/8 and below 19% it always ends at 1/8.
  # That is 1024 x 600 x 2 / 8 = 150 KB.
  #
  # Why not 25%: ESPHome tries internal SRAM when the fraction is at least 1/4,
  # but a quarter of this screen is 300 KB and a contiguous 300 KB block does not
  # exist in internal SRAM with Wi-Fi on. The allocation failed and fell back to
  # PSRAM, which caused both stutter and part of the artefacts: LVGL read and
  # rewrote PSRAM while the panel DMA was reading it continuously.
  #
  # CHECK THE BOOT LOG: if
  #   "Failed to allocate 153600 bytes for internal draw buffer"
  # appears, not even 150 KB fit and the buffer is still in PSRAM. In that case
