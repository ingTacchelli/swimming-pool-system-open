# =============================================================================
# TIMINGS
#   50 ms             UART reception
#   500 ms            link watchdog and unanswered commands
#   1 s               text refresh
#   trend_interval_s  one sample for each of the four trend series
# =============================================================================

interval:
  # ---------------------------------------------------------------- reception
  - interval: 50ms
    then:
      - lambda: |-
          while (id(uart_ctrl).available()) {
            uint8_t c;
            if (!id(uart_ctrl).read_byte(&c)) break;
            if (c != '\n' && c != '\r') {
              if (id(rx_buf).length() < 500) id(rx_buf) += (char) c;
              continue;
            }
            std::string msg = id(rx_buf);
            id(rx_buf).clear();
            if (msg.length() < 6) continue;

            size_t st = msg.rfind('*');
            if (st == std::string::npos || st + 2 >= msg.length()) continue;
            uint8_t x = 0;
            for (size_t i = 0; i < st; i++) x ^= (uint8_t) msg[i];
            char chk[4];
            snprintf(chk, sizeof(chk), "%02X", x);
            if (msg.compare(st + 1, 2, chk) != 0) continue;

            auto field = [&](const char *k) -> std::string {
              std::string key = std::string("|") + k + "=";
              size_t p = msg.find(key);
              if (p == std::string::npos) return std::string();
              p += key.length();
              size_t e = msg.find('|', p);
              if (e == std::string::npos || e > st) e = st;
              return msg.substr(p, e - p);
            };
            auto num = [&](const char *k) -> float {
              std::string v = field(k);
              if (v.empty()) return NAN;
              float f = atof(v.c_str());
              return (f <= -998.0f) ? NAN : f;     // -999 = invalid value
            };

            if (msg[0] == 'S') {
              id(g_last_rx) = millis();
              id(g_stale) = false;
              std::string mo = field("mo");
              if (!mo.empty()) id(g_mode) = mo;
              id(g_tv) = num("tv");
              id(g_tc) = num("tc");
              id(g_ph) = num("ph");
              id(g_ps) = num("ps");
              id(g_or) = num("or");
              id(g_os) = num("os");
              id(g_hz) = num("hz");
              id(g_cu) = num("cu");
              id(g_q1) = num("q1");
              id(g_q2) = num("q2");
              id(g_l1) = num("l1");
              id(g_l2) = num("l2");
              id(g_l3) = num("l3");
              id(g_pu) = field("pu") == "1";
              id(g_do) = field("do") == "1";
              id(g_cs) = atoi(field("cs").c_str());
              id(g_al) = atoi(field("al").c_str());
              id(g_f1) = field("f1") == "1";
              id(g_f2) = field("f2") == "1";
              id(g_f3) = field("f3") == "1";
              std::string ev = field("ev");
              if (ev.length() == 4) id(g_ev) = ev;
              std::string cbs = field("cb");
              if (cbs.length() == 13) id(g_cb) = cbs;
              id(g_pa) = num("pa"); id(g_pb) = num("pb"); id(g_dd) = num("dd");
              id(g_lc) = field("lc") == "1";
              id(g_dt) = field("dt");
            } else if (msg[0] == 'P') {
              id(g_p_ok) = true;
              id(g_p_t) = millis();
              // For 1.5 s after an edit made here the editable fields are left
              // alone: the optimistic value must not flicker.
              if (millis() - id(g_p_t_edit) > 1500) {
                id(g_p_fp) = num("fp");
                id(g_p_fc) = num("fc");
                id(g_p_dp) = num("dp");
                id(g_p_do) = num("do");
                id(g_p_fn) = num("fn");
                id(g_p_dl) = num("dl");
              }
              id(g_p_vp) = num("vp");
              id(g_p_vo) = num("vo");
              id(g_p_cp) = field("cp") == "1";
              id(g_p_co) = field("co") == "1";
              id(g_p_np) = field("np") == "1";
              id(g_p_no) = field("no") == "1";
              float t;
              t = num("bp"); id(g_p_bp) = isnan(t) ? 0.0f : t;
              t = num("bo"); id(g_p_bo) = isnan(t) ? 0.0f : t;
              t = num("mp"); id(g_p_mp) = isnan(t) ? 0.0f : t;
              t = num("mr"); id(g_p_mr) = isnan(t) ? 0.0f : t;
            } else if (msg[0] == 'G') {
              // Filtration schedule. Same 1.5 s rule as above for the editable fields.
              id(g_g_ok) = true;
              auto gi = [&](const char *k) { return atoi(field(k).c_str()); };
              if (millis() - id(g_g_t_edit) > 1500) {
                id(g_g_pr) = gi("pr"); id(g_g_mo) = gi("mo"); id(g_g_fv) = gi("fv"); id(g_g_sh) = gi("sh");
              }
              id(g_g_in) = gi("in"); id(g_g_fi) = gi("fi");
              id(g_g_vi) = gi("vi"); id(g_g_vf) = gi("vf");
              id(g_g_h0) = gi("h0"); id(g_g_h1) = gi("h1"); id(g_g_h2) = gi("h2");
              id(g_g_h3) = gi("h3"); id(g_g_h4) = gi("h4"); id(g_g_h5) = gi("h5");
              id(g_g_h6) = gi("h6");
              id(g_g_ac) = gi("ac"); id(g_g_tg) = gi("tg"); id(g_g_st) = gi("st");
            } else if (msg[0] == 'A') {
              int n = atoi(field("n").c_str());
              if (n == id(g_cmd_pending)) {
                id(g_cmd_pending) = 0;
                const bool it = id(g_lang) == 0;
                if (field("r") == "ok") id(g_result) = it ? "comando eseguito" : "command executed";
                else {
                  // The reason arrives from the control board in English. With the
                  // panel in Italian it is translated here; a reason that is not in
                  // the table is shown as received.
                  static const char *const REASONS[][2] = {
                    {"selector in ZERO", "selettore in ZERO"},
                    {"procedure in progress", "procedura in corso"},
                    {"selector not in MANUAL", "selettore non in MANUALE"},
                    {"frequency out of range", "frequenza fuori range"},
                    {"unknown valve", "valvola sconosciuta"},
                    {"duration out of range", "durata fuori range"},
                    {"acid drum empty", "fusto acido vuoto"},
                    {"chlorine drum empty", "fusto cloro vuoto"},
                    {"reserve drum empty", "fusto riserva vuoto"},
                    {"unknown command", "comando sconosciuto"},
                    {"invalid value", "valore non valido"},
                    {"value out of range", "valore fuori range"},
                    {"unknown parameter", "parametro sconosciuto"},
                    {"unknown reset", "reset sconosciuto"},
                    {"invalid buffer value", "valore buffer non valido"},
                    {"buffer out of range", "buffer fuori range"},
                    {"probe has no reading", "sonda senza lettura"},
                    {"unstable reading", "lettura instabile"},
                    {"buffer same as first point", "buffer uguale al primo punto"},
                    {"voltage same as first point", "tensione uguale al primo punto"},
                    {"abnormal slope", "pendenza anomala"},
                    {"unknown probe", "sonda sconosciuta"},
                  };
                  std::string why = field("w");
                  if (it) {
                    for (const auto &m : REASONS)
                      if (why == m[0]) { why = m[1]; break; }
                  }
                  id(g_result) = std::string(it ? "rifiutato: " : "rejected: ") + why;
                }
              }
            }
          }

  # -------------------------------------------------------- link watchdog
  - interval: 500ms
    then:
      - lambda: |-
          uint32_t now = millis();
          if (now - id(g_last_rx) > 3000) id(g_stale) = true;
          // The result message stays 5 s after its last change, then the bar
          // is cleared. The last value stays in g_result_hold for Home Assistant.
          static std::string result_prev;
          static uint32_t result_t = 0;
          if (id(g_result) != result_prev) {
            result_prev = id(g_result);
            result_t = now;
          } else if (!id(g_result).empty() && id(g_cmd_pending) == 0 && now - result_t > 5000) {
            id(g_result_hold) = id(g_result);
            id(g_result).clear();
            result_prev.clear();
          }
          // A command with no reply within 2 s has failed: never assumed done.
          if (id(g_cmd_pending) != 0 && now - id(g_cmd_t) > 2000) {
            id(g_cmd_pending) = 0;
            id(g_result) = id(g_lang) == 1 ? "no confirmation from the control board"
                                           : "nessuna conferma dalla scheda di controllo";
          }

  # ------------------------------------------------------------ text refresh
  # Two measures to avoid redrawing more than needed:
  #  1. only the visible page is updated; the navigation buttons call
  #     update_ui right after switching page;
  #  2. each label is rewritten only if its text really changed.
  # When the link is lost the values stay at the last received ones but the
  # header says so: showing old numbers without saying it would be worse than
  # not showing them.
  - interval: 1s
    then:
      - script.execute: check_sleep
      - script.execute: update_ui

  # ------------------------------------------------------------ trend sampler
  # Creates the four chart series once, then pushes one sample per interval.
  # Values are scaled to integers (pH x 100, flow x 10) because LVGL charts hold
  # int32. A stale link pushes "no value", which draws a gap.
  - interval: ${trend_interval_s}s
    then:
      - lambda: |-
          static lv_obj_t *c1 = nullptr, *c2 = nullptr;
          static lv_chart_series_t *s_ph = nullptr, *s_orp = nullptr;
          static lv_chart_series_t *s_tmp = nullptr, *s_flw = nullptr;
          const int N = ${trend_points};

          if (c1 == nullptr) {
            auto mk = [&](lv_obj_t *parent, lv_chart_series_t **sa, lv_chart_series_t **sb,
                          int a_min, int a_max, int b_min, int b_max) -> lv_obj_t * {
              lv_obj_t *c = lv_chart_create(parent);
              lv_obj_set_size(c, lv_pct(100), lv_pct(100));
              lv_obj_set_pos(c, 0, 0);
              lv_obj_remove_flag(c, LV_OBJ_FLAG_CLICKABLE);
              lv_chart_set_type(c, LV_CHART_TYPE_LINE);
              lv_chart_set_point_count(c, N);
              lv_chart_set_div_line_count(c, 5, 7);
              lv_chart_set_axis_range(c, LV_CHART_AXIS_PRIMARY_Y, a_min, a_max);
              lv_chart_set_axis_range(c, LV_CHART_AXIS_SECONDARY_Y, b_min, b_max);
              lv_obj_set_style_bg_opa(c, LV_OPA_TRANSP, LV_PART_MAIN);
              lv_obj_set_style_border_width(c, 0, LV_PART_MAIN);
              lv_obj_set_style_pad_all(c, 0, LV_PART_MAIN);
              lv_obj_set_style_line_color(c, lv_color_hex(0x2C3846), LV_PART_MAIN);
              lv_obj_set_style_line_width(c, 3, LV_PART_ITEMS);
              lv_obj_set_style_size(c, 0, 0, LV_PART_INDICATOR);
              *sa = lv_chart_add_series(c, lv_color_hex(0x4EC8E6), LV_CHART_AXIS_PRIMARY_Y);
              *sb = lv_chart_add_series(c, lv_color_hex(0xF2A93B), LV_CHART_AXIS_SECONDARY_Y);
              lv_chart_set_all_values(c, *sa, LV_CHART_POINT_NONE);
              lv_chart_set_all_values(c, *sb, LV_CHART_POINT_NONE);
              return c;
            };
            c1 = mk(id(trend_box_1), &s_ph, &s_orp, 600, 900, 400, 900);
            c2 = mk(id(trend_box_2), &s_tmp, &s_flw, 100, 400, 0, 300);

            int total = N * ${trend_interval_s};
            char span[32];
            const bool en = id(g_lang) == 1;
            if (total >= 3600) snprintf(span, sizeof(span), en ? "last %.1f h" : "ultime %.1f h", total / 3600.0f);
            else snprintf(span, sizeof(span), en ? "last %d min" : "ultimi %d min", total / 60);
            lv_label_set_text(id(lbl_t_span1), span);
            lv_label_set_text(id(lbl_t_span2), span);
          }

          auto sc = [](float v, float k) -> int32_t {
            return isnan(v) ? (int32_t) LV_CHART_POINT_NONE : (int32_t) lroundf(v * k);
          };
          const bool ok = !id(g_stale);
          lv_chart_set_next_value(c1, s_ph,  ok ? sc(id(g_ph), 100.0f) : (int32_t) LV_CHART_POINT_NONE);
          lv_chart_set_next_value(c1, s_orp, ok ? sc(id(g_or), 1.0f)   : (int32_t) LV_CHART_POINT_NONE);
          lv_chart_set_next_value(c2, s_tmp, ok ? sc(id(g_tv), 10.0f)  : (int32_t) LV_CHART_POINT_NONE);
          lv_chart_set_next_value(c2, s_flw, ok ? sc(id(g_q1), 10.0f)  : (int32_t) LV_CHART_POINT_NONE);

# =============================================================================
# DIAGNOSTICS TOWARDS HOME ASSISTANT
# =============================================================================

debug:
  update_interval: 5s

sensor:
  - platform: uptime
    name: "Panel uptime"
    update_interval: 60s
  - platform: wifi_signal
    name: "Panel Wi-Fi RSSI"
    id: s_rssi
    update_interval: 60s
  # Memory, for the Settings page. The number that matters for smoothness is the
  # largest block of internal SRAM: the LVGL buffer needs 150 KB contiguous.
  - platform: debug
    free:
      name: "Panel free internal heap"
      id: s_heap_free
    block:
      name: "Panel largest internal heap block"
      id: s_heap_block
    psram:
      name: "Panel free PSRAM"
      id: s_heap_psram

binary_sensor:
  - platform: template
    name: "Control board link"
    device_class: connectivity
    lambda: 'return !id(g_stale);'

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "Panel IP"
      id: ts_ip
    ssid:
      name: "Panel SSID"
      id: ts_ssid
  - platform: template
    name: "Last command result"
    update_interval: 5s
    lambda: 'return {id(g_result).empty() ? id(g_result_hold) : id(g_result)};'
