            put(id(lbl_p_dp), pf(id(g_p_dp), "%.2f pH"));
            put(id(lbl_p_do), pf(id(g_p_do), "%.0f mV"));
            put(id(lbl_p_fn), pf(id(g_p_fn), "%.0f Hz"));

          } else if (id(page_cal)->is_showing()) {
            k = 84;
            const bool pv = id(g_p_ok) && (millis() - id(g_p_t) < 6000);
            // buffer selection
            if (cc[10] != id(g_cal_bp)) {
              cc[10] = id(g_cal_bp);
              lv_obj_t *bb[5] = { id(bp0), id(bp1), id(bp2), id(bp3), id(bp4) };
              for (int i = 0; i < 5; i++)
                lv_obj_set_style_bg_color(bb[i],
                  lv_color_hex(i == id(g_cal_bp) ? 0x2C5A46 : 0x2C3846), LV_PART_MAIN);
            }
            if (cc[11] != id(g_cal_bo)) {
              cc[11] = id(g_cal_bo);
              lv_obj_set_style_bg_color(id(bo0),
                lv_color_hex(id(g_cal_bo) == 0 ? 0x2C5A46 : 0x2C3846), LV_PART_MAIN);
              lv_obj_set_style_bg_color(id(bo1),
                lv_color_hex(id(g_cal_bo) == 1 ? 0x2C5A46 : 0x2C3846), LV_PART_MAIN);
            }

            // --- pH ---
            std::string l = f1(id(g_ph), en ? "pH now %.2f" : "pH attuale %.2f",
                               en ? "pH now --" : "pH attuale --");
            l += pv && !isnan(id(g_p_vp)) ? f1(id(g_p_vp), en ? "     probe voltage %.4f V"
                                                              : "     tensione sonda %.4f V", "")
                                           : std::string("");
            put(id(lbl_cp_live), l);
            std::string st;
            int colp;
            if (!pv) { st = T("collegamento assente", "no data"); colp = GREY; }
            else if (id(g_p_np)) {
              snprintf(b, sizeof(b), en ? "Point 1 taken at pH %.2f: now the second buffer"
                                        : "Punto 1 acquisito a pH %.2f: ora il secondo buffer",
                       id(g_p_bp));
              st = b; colp = AMBER;
            } else if (id(g_p_cp)) {
              snprintf(b, sizeof(b), en ? "Calibration valid   (slope %.1f mV/pH)"
                                        : "Calibrazione valida   (pendenza %.1f mV/pH)",
                       fabsf(id(g_p_mp)) > 0.001f ? 1000.0f / fabsf(id(g_p_mp)) : 0.0f);
              st = b; colp = GREEN;
            } else { st = T("NON calibrata: il dosaggio resta bloccato", "NOT calibrated: dosing stays locked"); colp = RED; }
            put(id(lbl_cp_state), st);
            col(id(lbl_cp_state), 12, colp);

            // --- ORP ---
            l = f1(id(g_or), en ? "ORP now %.0f mV" : "ORP attuale %.0f mV",
                   en ? "ORP now --" : "ORP attuale --");
            l += pv && !isnan(id(g_p_vo)) ? f1(id(g_p_vo), en ? "     probe voltage %.4f V"
                                                              : "     tensione sonda %.4f V", "")
                                           : std::string("");
            put(id(lbl_co_live), l);
            if (!pv) { st = T("collegamento assente", "no data"); colp = GREY; }
            else if (id(g_p_no)) {
              snprintf(b, sizeof(b), en ? "Point 1 taken at %.0f mV: now the second buffer"
                                        : "Punto 1 acquisito a %.0f mV: ora il secondo buffer",
                       id(g_p_bo));
              st = b; colp = AMBER;
            } else if (id(g_p_co)) {
              snprintf(b, sizeof(b), en ? "Calibration valid   (gain %.3f)"
                                        : "Calibrazione valida   (guadagno %.3f)",
                       id(g_p_mr) / 1000.0f);
              st = b; colp = GREEN;
            } else { st = T("NON calibrato: il dosaggio resta bloccato", "NOT calibrated: dosing stays locked"); colp = RED; }
            put(id(lbl_co_state), st);
            col(id(lbl_co_state), 13, colp);

          } else if (id(page_synoptic)->is_showing()) {
            k = 92;
            const bool okl = !id(g_stale);
            const bool flowing = okl && id(g_pu);

            // values
            put(id(lbl_y_tv), s_tv);
            put(id(lbl_y_hz), s_hz);
            put(id(lbl_y_cu), f1(id(g_cu), en ? "current %.0f %%" : "corrente %.0f %%", "--"));
            put(id(lbl_y_q1), f1(id(g_q1), "%.1f m3/h", "-- m3/h"));
            put(id(lbl_y_ph), f1(id(g_ph), "pH %.2f", "pH --"));
            put(id(lbl_y_or), f1(id(g_or), "ORP %.0f mV", "ORP -- mV"));
            put(id(lbl_y_tc), f1(id(g_tc), en ? "cell %.1f C" : "cella %.1f C", "--"));
            put(id(lbl_y_q2), f1(id(g_q2), en ? "cell flow %.1f m3/h" : "portata cella %.1f m3/h", "-- m3/h"));
            lv_obj_t *lf[3] = { id(lbl_y_l1), id(lbl_y_l2), id(lbl_y_l3) };
            float lt[3] = { id(g_l1), id(g_l2), id(g_l3) };
            bool fl[3] = { id(g_f1), id(g_f2), id(g_f3) };
            for (int i = 0; i < 3; i++) {
              if (!fl[i] && okl) put(lf[i], T("VUOTO", "EMPTY"));
              else put(lf[i], f1(lt[i], "%.0f%%", "--"));
              int cv = (!fl[i] && okl) ? RED : WHITE;
              if (cc[24 + i] != cv) {
                cc[24 + i] = cv;
                lv_obj_set_style_text_color(lf[i], lv_color_hex(cv), LV_PART_MAIN);
              }
            }
            put(id(lbl_y_do), s_dos);
            std::string s_dp = "--";
            if (okl && !isnan(id(g_pa)) && !isnan(id(g_pb))) {
              snprintf(b, sizeof(b), en ? "in %.2f  out %.2f bar  dP %.2f" : "monte %.2f  valle %.2f bar  dP %.2f",
                       id(g_pa), id(g_pb), id(g_dd));
              s_dp = b;
            }
            put(id(lbl_y_dp), s_dp);
            put(id(lbl_y_bw), (okl && id(g_lc)) ? T("LAVAGGIO CONSIGLIATO", "BACKWASH ADVISED") : std::string());
            col(id(lbl_y_do), 27, id(g_do) ? GREEN : AMBER);
            lv_obj_t *le[4] = { id(lbl_y_e1), id(lbl_y_e2), id(lbl_y_e3), id(lbl_y_e4) };
            lv_obj_t *lc[3] = { id(lbl_y_c1), id(lbl_y_c2), id(lbl_y_c3) };
            for (int i = 0; i < 4; i++) {
              bool on = ev[i] == '1';
              if (i == 3) put(le[i], on ? lt_on : lt_off);
              else {
                put(le[i], on ? ev_open : std::string());     // open: left of the square
                put(lc[i], on ? std::string() : ev_closed);   // closed: below the square
              }
              col(le[i], 28 + i, (okl && on) ? (i == 3 ? 0xE0C252 : GREEN) : GREY);
            }

            // colours of the diagram: only when they change
            auto tint = [&](lv_obj_t *o, int slot, int rgb) {
              if (cc[slot] == rgb) return;
              cc[slot] = rgb;
              lv_obj_set_style_bg_color(o, lv_color_hex(rgb), LV_PART_MAIN);
            };
            const int WATER = 0x2F7FB5, OFFC = 0x232D39;
            lv_obj_t *pp[6] = { id(syn_p1), id(syn_p2), id(syn_p3), id(syn_p4), id(syn_p5), id(syn_p6) };
            for (int i = 0; i < 6; i++) tint(pp[i], 32 + i, flowing ? WATER : OFFC);
            tint(id(syn_pump), 38, flowing ? 0x2C5A46 : 0x161C24);
            lv_obj_t *sa[3] = { id(syn_a1), id(syn_a2), id(syn_a3) };
            lv_obj_t *sb[3] = { id(syn_b1), id(syn_b2), id(syn_b3) };
            lv_obj_t *se[3] = { id(syn_ev1), id(syn_ev2), id(syn_ev3) };
            for (int i = 0; i < 3; i++) {
              bool op = okl && ev[i] == '1';
              tint(sa[i], 39 + i, (flowing && op) ? WATER : OFFC);
              tint(sb[i], 43 + i, (flowing && op) ? WATER : OFFC);
              tint(se[i], 47 + i, op ? 0x4CAF7D : OFFC);
            }
            lv_obj_t *sr[3] = { id(syn_r1), id(syn_r2), id(syn_r3) };
            for (int i = 0; i < 3; i++) tint(sr[i], 51 + i, flowing ? WATER : OFFC);   // the bypass always keeps the return open
            tint(id(syn_bp), 60, flowing ? WATER : OFFC);
            tint(id(syn_light), 61, (okl && ev[3] == '1') ? 0x6B5A1E : 0x161C24);
            lv_obj_set_style_border_color(id(syn_light),
              lv_color_hex((okl && ev[3] == '1') ? 0xE0C252 : 0x3A4756), LV_PART_MAIN);
            lv_obj_t *sd[3] = { id(syn_d1), id(syn_d2), id(syn_d3) };
            for (int i = 0; i < 3; i++) tint(sd[i], 54 + i, (okl && id(g_do)) ? 0x8A6A2E : OFFC);
            lv_obj_t *st[3] = { id(syn_t1), id(syn_t2), id(syn_t3) };
            for (int i = 0; i < 3; i++) {
              bool known = okl && !isnan(lt[i]);
              lv_bar_set_value(st[i], known ? (int) lt[i] : 0, LV_ANIM_OFF);
              int ct = !known ? 0x3A4756 : (lt[i] < 20.0f ? 0xE05252 : 0x4A90C8);
              if (cc[57 + i] != ct) {
                cc[57 + i] = ct;
                lv_obj_set_style_bg_color(st[i], lv_color_hex(ct), LV_PART_INDICATOR);
              }
            }

          } else if (id(page_trends)->is_showing()) {
            // The charts are fed by the trend sampler (interval at the end of the
            // file); here only the span labels follow the language.
            static int span_lang = -1;
            if (span_lang != id(g_lang)) {
              span_lang = id(g_lang);
              int total = ${trend_points} * ${trend_interval_s};
              char span[32];
              if (total >= 3600) snprintf(span, sizeof(span), en ? "last %.1f h" : "ultime %.1f h", total / 3600.0f);
              else snprintf(span, sizeof(span), en ? "last %d min" : "ultimi %d min", total / 60);
              lv_label_set_text(id(lbl_t_span1), span);
              lv_label_set_text(id(lbl_t_span2), span);
            }
          }

# =============================================================================
# LVGL USER INTERFACE
#
# The navigation bar, the header and the status bar are in the top_layer: a
# single layer drawn above all the pages, so they exist once instead of once per
# page. The layer itself is transparent and does not intercept touch; only its
# children do, i.e. the left column and its buttons. If the touch ever stops
# responding on the pages, this is the first place to look.
#
# Geometry: column 0..190, content 214..1000, header y 18, status bar y 566.
# The pages use the band y 56..556.
# =============================================================================

lvgl:
  displays:
    - screen
  touchscreens:
    - touch
  # 12% = one eighth of the screen, which is the smallest buffer ESPHome
  # accepts: the value is rounded to 1/1, 1/2, 1/4 or 1/8, and below 19% it
  # always ends up at 1/8. That is 1024 x 600 x 2 / 8 = 150 KB.
  #
  # Why not 25%: ESPHome tries internal SRAM when the fraction is at least 1/4,
  # but a quarter of this screen is 300 KB, and a contiguous 300 KB block does
  # not exist in internal SRAM with Wi-Fi on. The allocation then fails and
  # falls back to PSRAM, which causes stutter and artefacts: LVGL reads and
  # rewrites PSRAM while the panel DMA is reading it continuously.
  #
  # CHECK IN THE BOOT LOG: if
  #   "Failed to allocate 153600 bytes for internal draw buffer"
  # appears, not even 150 KB fit and the buffer is still in PSRAM. In that case
  # free internal SRAM by removing web_server, and if that is not enough remove
  # CONFIG_ESP32S3_DATA_CACHE_64KB, which alone takes 32 KB.
  buffer_size: 12%
  bg_color: 0x0E1116

  style_definitions:
    - id: st_panel
      bg_color: 0x1B222B
      bg_opa: COVER
      radius: 12
      border_width: 0
      pad_all: 14
    - id: st_label
      text_color: 0x8A97A6
      text_font: f_small
    - id: st_value
      text_color: 0xFFFFFF
      text_font: f_value
    - id: st_medium
      text_color: 0xFFFFFF
      text_font: f_title
    - id: st_nav
      bg_color: 0x141A21
      bg_opa: COVER
      radius: 8
      border_width: 0

  # --------------------------------------------------------------------------
  # Shared layer: navigation column, header, status bar
  # --------------------------------------------------------------------------
  top_layer:
    bg_opa: TRANSP
    widgets:
      - obj:
          id: side_bar
          x: 0
          y: 0
          width: 190
          height: 600
          bg_color: 0x141A21
