# =============================================================================
# SPB Swimming Pool Board - DISPLAY PANEL firmware (ESPHome)
# Waveshare ESP32-S3-Touch-LCD-7B (1024x600, GT911 touch, CH32V003 expander)
#
# Single self-contained file: it includes nothing else.
#
# No predefined display model is used. The Waveshare 1024x600 profiles of
# mipi_rgb are those of the 5" board, which carries a different expander and
# requires it to be configured. The 7B carries a CH32V003, so the panel is
# described pin by pin, with timings verified on the real board.
#
# Pages (navigation bar on the left): Synoptic, Home, Filtration (pump +
# scheduler), Chemistry, Valves, Alarms (2 pages), Maintenance, Commands,
# Settings (screen, language, PIN-protected Wi-Fi / parameters / calibration /
# restart) and Trends. User interface in English or Italian, selectable from
# Settings.
#
# What lives where:
#   - This panel only REQUESTS. Every command goes to the control board over
#     the UART link and the control board decides (see docs/uart-protocol.md).
#   - Settings of the panel itself (brightness, screen timeout, language) are
#     stored here, in flash.
#   - Plant parameters, probe calibration and the filtration schedule are
#     stored on the control board; the panel shows what the board reports.
#
# GPIO MAP
#   GPIO43/44  UART to the control board, on the 4-pin header H3.
#              GPIO15 and GPIO16 are NOT usable as TTL on this board: they are
#              wired to the SP3485 and form the RS-485 pair (IO15 = RS485_TX,
#              IO16 = RS485_RX in the allocation table of the Waveshare
#              schematic, sheet 1). The only TTL UART brought out is UART0 on
#              GPIO43/44, which goes through U13 (FSUSB42UMX, 2:1 switch) and
#              ends either on the CH343P USB-serial bridge or on header H3,
#              depending on SW1. Keep SW1 on the position that routes the UART
#              to H3.
#   GPIO8/9    I2C (GT911 touch + CH32V003 expander)
#   GPIO4      touch interrupt
#   GPIO5 DE / GPIO46 HSYNC / GPIO3 VSYNC / GPIO7 PCLK
#   red    1, 2, 42, 41, 40
#   green  39, 0, 45, 48, 47, 21
#   blue   14, 38, 18, 17, 10
# =============================================================================

substitutions:
  device_name: "spb-display"
  device_friendly_name: "SPB Pool Panel"
  timezone: "Europe/Rome"          # IANA time zone of the installation
  # PIN that unlocks Wi-Fi change, plant parameters, calibration and restart in
  # the Settings page. Digits only, 8 at most. CHANGE IT before installing: it
  # ends up in the firmware.
  settings_pin: "1234"

  # Trend charts: one sample every trend_interval_s seconds, trend_points samples
  # per chart. 30 s x 240 = the last 2 hours. For a demo or a video, 2 s x 240
  # fills the chart in a few minutes.
  trend_interval_s: "30"
  trend_points: "240"

esphome:
  name: ${device_name}
  friendly_name: ${device_friendly_name}
  comment: "SPB pool touch panel"
  min_version: "2025.8.0"
  # The LVGL chart widget is not part of the ESPHome LVGL schema: enable it in the
  # LVGL build and draw the charts from lambdas (see the trend sampler below).
  build_flags:
    - -DLV_USE_CHART=1
  on_boot:
    # After LVGL and the backlight are ready: apply the saved brightness and
    # align the slider. The backlight always starts on (see restore_mode).
    priority: -100
    then:
      - lambda: |-
          lv_slider_set_value(id(sld_lum), id(g_lum), LV_ANIM_OFF);
          id(g_touch) = millis();
          auto call = id(backlight).turn_on();
          call.set_brightness(id(g_lum) / 100.0f);
          call.perform();

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      # --- RGB panel smoothness ---------------------------------------------
      # Goal: make the LVGL draw buffer fit in internal SRAM. ESPHome tries
      # that by itself, but if it cannot find a contiguous block it falls back
      # to PSRAM, and LVGL then draws on the same bus the panel DMA is reading
      # continuously.
      #
      # This option moves the Wi-Fi and LWIP buffers to PSRAM and frees several
      # tens of KB of internal SRAM. The extra PSRAM traffic is negligible: a
      # few hundred KB/s against about 40 MB/s of panel scanout.
      CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP: "y"
      # Data cache from 32 to 64 KB with a 64-byte line instead of 32: fewer
      # misses on PSRAM accesses. It costs 32 KB of internal SRAM, so it pulls
      # in the opposite direction to the line above: if the log says the
      # internal buffer does not fit, remove this first.
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
  # Do NOT set cpu_frequency: 240MHz -> on this board it prevents boot

psram:
  mode: octal
  # 80 MHz is the maximum: 120 MHz exists only for quad PSRAM, and ESPHome
  # rejects it in octal mode.
  speed: 80MHz

# --- CH32V003 expander: external component -----------------------------------
# Not part of ESPHome. It is third-party code compiled together with the
# firmware, pinned here to a specific commit so that an update of the upstream
# repository cannot change your firmware under your feet.
external_components:
  - source:
      type: git
      url: https://github.com/fuzzybear62/esphome-waveshare_io_ch32v003
      ref: 96fc04c1920a55ee5c2ac68ba826c4fce2abd0e6
    components: [ waveshare_io_ch32v003 ]

logger:
  level: INFO
  # The log MUST go out on the native USB, not on UART0: UART0 (GPIO43/44) is
  # the link to the control board. With the default, ESPHome would put the
  # logger on UART0 and log lines would end up inside the protocol frames, plus
  # a conflict on the same peripheral.
  # With SW1 on H3 the CH343P bridge is disconnected anyway, so the console is
  # read from the other USB-C, the native one (GPIO19/20).
  hardware_uart: USB_SERIAL_JTAG

api:
  encryption:
    key: !secret api_key_display
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 0s
  ap:
    ssid: "SPB-Display-Fallback"
    password: !secret ap_password

captive_portal:

web_server:
  port: 80
  version: 3
  local: true

time:
  - platform: sntp
    id: local_time
    timezone: ${timezone}

# =============================================================================
# PANEL HARDWARE
# =============================================================================

i2c:
  id: bus_i2c
  sda: GPIO8
  scl: GPIO9
  frequency: 400kHz
  scan: true

waveshare_io_ch32v003:
  - id: wave_io
    i2c_id: bus_i2c
    address: 0x24

output:
  - platform: waveshare_io_ch32v003
    id: out_backlight
    waveshare_io_ch32v003_id: wave_io
    inverted: true
    zero_means_zero: true
    safe_pwm_levels:
      min_value: 0
      max_value: 247

light:
  - platform: monochromatic
    name: "Backlight"
    id: backlight
    output: out_backlight
    # ALWAYS_ON and not RESTORE_*: the brightness is saved by g_lum (once, when
    # the slider is released). With RESTORE_* every on/off caused by the screen
    # timeout would write to flash.
    restore_mode: ALWAYS_ON
    default_transition_length: 200ms

# Fonts are downloaded from Google Fonts at compile time: the machine running
# the build needs internet access. bpp: 4 gives smooth edges at low cost.
font:
  - file: "gfonts://Roboto"
    id: f_value
    size: 48
    bpp: 4
  - file: "gfonts://Roboto"
    id: f_title
    size: 30
    bpp: 4
  - file: "gfonts://Roboto"
    id: f_text
    size: 22
    bpp: 4
  - file: "gfonts://Roboto"
    id: f_small
    size: 17
    bpp: 4
  - file: "gfonts://Roboto"
    id: f_micro
    size: 14
    bpp: 4

display:
  - platform: rpi_dpi_rgb
    id: screen
    auto_clear_enabled: false
    update_interval: never
    color_order: RGB
    # 30 MHz, which is also the maximum allowed by the component.
    # With this panel's timings the full frame is 1386 x 661 pixel clocks, so
    #   30 MHz -> 30e6 / 916146 = 32.7 Hz
    #   21 MHz -> 22.9 Hz
    # and 23 Hz is clearly visible. The pixel clock is not the bottleneck: the
    # 30 MHz scanout asks about 40 MB/s from an octal PSRAM that delivers well
    # over a hundred. What matters is where LVGL draws, not how fast the panel
    # reads.
    pclk_frequency: 30MHz
    pclk_inverted: true
    dimensions:
      width: 1024
      height: 600
    de_pin:
      number: 5
    hsync_pin:
      number: 46
      ignore_strapping_warning: true
    vsync_pin:
      number: 3
      ignore_strapping_warning: true
    pclk_pin: 7
    hsync_pulse_width: 162
    hsync_back_porch: 152
    hsync_front_porch: 48
    vsync_pulse_width: 45
    vsync_back_porch: 13
    vsync_front_porch: 3
    data_pins:
      red:   [1, 2, 42, 41, 40]
      green: [39, 0, 45, 48, 47, 21]
      blue:  [14, 38, 18, 17, 10]
    reset_pin:
      waveshare_io_ch32v003: wave_io
      number: 3
      mode: OUTPUT

touchscreen:
  - platform: gt911
    id: touch
    # every touch resets the screen-timeout counter
    on_touch:
      - lambda: 'id(g_touch) = millis();'
    i2c_id: bus_i2c
    display: screen
    interrupt_pin: GPIO4
    reset_pin:
      waveshare_io_ch32v003: wave_io
      number: 1
      mode: OUTPUT

# =============================================================================
# UART LINK TO THE CONTROL BOARD
#
#   GPIO43 TX -> RX of the control board (GPIO16 on the control side)
#   GPIO44 RX <- TX of the control board (GPIO15 on the control side)
#   common GND
#   115200 8N1
#
# Both signals come out on the 4-pin header H3:
#   pin 1  3V3      <- output, do NOT power it from outside
#   pin 2  GND
#   pin 3  EX_RXD   = GPIO44, input    <- the other board's TX goes here
#   pin 4  EX_TXD   = GPIO43, output   -> the other board's RX goes here
#
# At power-up the ROM bootloader prints one line on GPIO43 at 115200. It is
# unavoidable and harmless: it does not start with a frame letter and the
# checksum discards it anyway.
#
# Frames received: S (status), P (parameters and calibration), G (filtration
# schedule), A (command reply). Frames sent: C (commands).
# See docs/uart-protocol.md.
#
# All values live in globals: the LVGL pages only read them. If no valid S
# frame arrives for 3 seconds, g_stale becomes true and the UI says so.
# =============================================================================

uart:
  - id: uart_ctrl
    tx_pin: GPIO43
    rx_pin: GPIO44
    baud_rate: 115200
    data_bits: 8
    parity: NONE
    stop_bits: 1
    rx_buffer_size: 1024

globals:
  - {id: rx_buf, type: std::string, restore_value: false, initial_value: '""'}
  - {id: g_last_rx, type: uint32_t, restore_value: false, initial_value: '0'}
  - {id: g_stale, type: bool, restore_value: false, initial_value: 'true'}

  # --- plant state received from the control board (S frame) -----------------
  - {id: g_mode, type: std::string, restore_value: false, initial_value: '"?"'}
  - {id: g_tv, type: float, restore_value: false, initial_value: 'NAN'}   # pool temperature
  - {id: g_tc, type: float, restore_value: false, initial_value: 'NAN'}   # cell temperature
  - {id: g_ph, type: float, restore_value: false, initial_value: 'NAN'}
  - {id: g_ps, type: float, restore_value: false, initial_value: 'NAN'}   # pH secondary
  - {id: g_or, type: float, restore_value: false, initial_value: 'NAN'}
  - {id: g_os, type: float, restore_value: false, initial_value: 'NAN'}   # ORP secondary
  - {id: g_hz, type: float, restore_value: false, initial_value: 'NAN'}
  - {id: g_cu, type: float, restore_value: false, initial_value: 'NAN'}   # VFD current, %
  - {id: g_q1, type: float, restore_value: false, initial_value: 'NAN'}   # main flow
  - {id: g_q2, type: float, restore_value: false, initial_value: 'NAN'}   # cell flow
  - {id: g_l1, type: float, restore_value: false, initial_value: 'NAN'}   # tank levels, %
  - {id: g_l2, type: float, restore_value: false, initial_value: 'NAN'}
  - {id: g_l3, type: float, restore_value: false, initial_value: 'NAN'}
  - {id: g_pu, type: bool, restore_value: false, initial_value: 'false'}  # pump running
  - {id: g_do, type: bool, restore_value: false, initial_value: 'false'}  # dosing enabled
  - {id: g_cs, type: int, restore_value: false, initial_value: '0'}       # permissives satisfied
  - {id: g_al, type: int, restore_value: false, initial_value: '0'}       # active alarms
  - {id: g_ev, type: std::string, restore_value: false, initial_value: '"0000"'}
  - {id: g_f1, type: bool, restore_value: false, initial_value: 'true'}   # tank floats
  - {id: g_f2, type: bool, restore_value: false, initial_value: 'true'}
  - {id: g_f3, type: bool, restore_value: false, initial_value: 'true'}
  - {id: g_cb, type: std::string, restore_value: false, initial_value: '"0000000000000"'}  # 13 permissives
  - {id: g_pa, type: float, restore_value: false, initial_value: 'NAN'}  # filter pressure, upstream
  - {id: g_pb, type: float, restore_value: false, initial_value: 'NAN'}  # filter pressure, downstream
  - {id: g_dd, type: float, restore_value: false, initial_value: 'NAN'}  # differential
  - {id: g_lc, type: bool, restore_value: false, initial_value: 'false'} # backwash advised
  - {id: g_dt, type: std::string, restore_value: false, initial_value: '"0"'}  # board clock YYYYMMDDHHMM

  # --- outgoing commands -------------------------------------------------------
  - {id: g_cmd_n, type: int, restore_value: false, initial_value: '0'}
  - {id: g_cmd_pending, type: int, restore_value: false, initial_value: '0'}
  - {id: g_cmd_t, type: uint32_t, restore_value: false, initial_value: '0'}
  - {id: g_result, type: std::string, restore_value: false, initial_value: '""'}
  - {id: g_result_hold, type: std::string, restore_value: false, initial_value: '""'}  # last result, kept for Home Assistant

  # --- local entry values (they only compose the command to send) --------------
  - {id: g_hz_set, type: float, restore_value: false, initial_value: '42.0f'}
  - {id: g_jog_s, type: int, restore_value: false, initial_value: '10'}

  # --- panel settings, saved to flash ------------------------------------------
  # Written only when the user changes something: ESPHome saves a global only
  # if its value changed.
  - {id: g_lum, type: int, restore_value: true, initial_value: '100'}        # brightness %, 5..100
  - {id: g_timeout_s, type: int, restore_value: true, initial_value: '0'}    # screen timeout, 0 = never
  - {id: g_lang, type: int, restore_value: true, initial_value: '1'}         # 0 = Italian, 1 = English

  # --- internal state of the settings, not saved --------------------------------
  - {id: g_touch, type: uint32_t, restore_value: false, initial_value: '0'}  # millis() of the last touch
  - {id: g_sleep, type: bool, restore_value: false, initial_value: 'false'}  # true = screen off
  - {id: g_pin_action, type: int, restore_value: false, initial_value: '0'}  # what the PIN unlocks: 1 Wi-Fi, 2 restart, 3 parameters, 4 calibration
  - {id: g_pin_result, type: int, restore_value: false, initial_value: '0'}  # 0 nothing, 1..4 unlocked (as the action), 9 Wi-Fi saved

  # --- filtration schedule, from the G frame -------------------------------------
  - {id: g_g_ok, type: bool, restore_value: false, initial_value: 'false'}
  - {id: g_g_t_edit, type: uint32_t, restore_value: false, initial_value: '0'}
  - {id: g_g_pr, type: int, restore_value: false, initial_value: '0'}   # program
  - {id: g_g_mo, type: int, restore_value: false, initial_value: '0'}   # mode
  - {id: g_g_fv, type: int, restore_value: false, initial_value: '0'}   # photovoltaic
  - {id: g_g_sh, type: int, restore_value: false, initial_value: '0'}   # shock
  - {id: g_g_in, type: int, restore_value: false, initial_value: '0'}
  - {id: g_g_fi, type: int, restore_value: false, initial_value: '0'}
  - {id: g_g_vi, type: int, restore_value: false, initial_value: '0'}
  - {id: g_g_vf, type: int, restore_value: false, initial_value: '0'}
  - {id: g_g_h0, type: int, restore_value: false, initial_value: '0'}
  - {id: g_g_h1, type: int, restore_value: false, initial_value: '0'}
  - {id: g_g_h2, type: int, restore_value: false, initial_value: '0'}
  - {id: g_g_h3, type: int, restore_value: false, initial_value: '0'}
  - {id: g_g_h4, type: int, restore_value: false, initial_value: '0'}
  - {id: g_g_h5, type: int, restore_value: false, initial_value: '0'}
  - {id: g_g_h6, type: int, restore_value: false, initial_value: '0'}
  - {id: g_g_ac, type: int, restore_value: false, initial_value: '0'}   # minutes run today
  - {id: g_g_tg, type: int, restore_value: false, initial_value: '0'}   # today's target
  - {id: g_g_st, type: int, restore_value: false, initial_value: '0'}   # status

  # --- parameters and calibration, from the P frame -------------------------------
  - {id: g_p_ok, type: bool, restore_value: false, initial_value: 'false'}
  - {id: g_p_t, type: uint32_t, restore_value: false, initial_value: '0'}       # millis() of the last P frame
  - {id: g_p_t_edit, type: uint32_t, restore_value: false, initial_value: '0'}  # millis() of the last edit made here
  - {id: g_p_fp, type: float, restore_value: false, initial_value: 'NAN'}
  - {id: g_p_fc, type: float, restore_value: false, initial_value: 'NAN'}
  - {id: g_p_dp, type: float, restore_value: false, initial_value: 'NAN'}
  - {id: g_p_do, type: float, restore_value: false, initial_value: 'NAN'}
  - {id: g_p_fn, type: float, restore_value: false, initial_value: 'NAN'}
  - {id: g_p_dl, type: float, restore_value: false, initial_value: 'NAN'}
  - {id: g_p_vp, type: float, restore_value: false, initial_value: 'NAN'}
  - {id: g_p_vo, type: float, restore_value: false, initial_value: 'NAN'}
  - {id: g_p_mp, type: float, restore_value: false, initial_value: '0'}
  - {id: g_p_mr, type: float, restore_value: false, initial_value: '0'}
  - {id: g_p_bp, type: float, restore_value: false, initial_value: '0'}
  - {id: g_p_bo, type: float, restore_value: false, initial_value: '0'}
  - {id: g_p_cp, type: bool, restore_value: false, initial_value: 'false'}
  - {id: g_p_co, type: bool, restore_value: false, initial_value: 'false'}
  - {id: g_p_np, type: bool, restore_value: false, initial_value: 'false'}
  - {id: g_p_no, type: bool, restore_value: false, initial_value: 'false'}
  - {id: g_cal_bp, type: int, restore_value: false, initial_value: '2'}   # pH buffer chosen in Calibration (index)
  - {id: g_cal_bo, type: int, restore_value: false, initial_value: '0'}   # ORP buffer chosen (index)

script:
  # Sends a command and waits for the ack. The outcome goes into g_result, which
  # the UI shows: "sent...", "executed", or the reason for the refusal.
  - id: send_command
    mode: queued
    parameters:
      cmd: string
      val: string
    then:
      - lambda: |-
          const bool en = id(g_lang) == 1;
          if (id(g_stale)) {
            id(g_result) = en ? "link lost: command not sent"
                              : "collegamento assente: comando non inviato";
            return;
          }
          id(g_cmd_n) = (id(g_cmd_n) % 999) + 1;
          id(g_cmd_pending) = id(g_cmd_n);
          id(g_cmd_t) = millis();
          id(g_result) = en ? "command sent, waiting for confirmation"
                            : "comando inviato, attendo conferma";

          char body[120];
          snprintf(body, sizeof(body), "C|n=%d|c=%s|v=%s|",
                   id(g_cmd_n), cmd.c_str(), val.c_str());
          uint8_t x = 0;
          for (const char *p = body; *p; p++) x ^= (uint8_t) *p;
          char out[140];
          snprintf(out, sizeof(out), "%s*%02X\n", body, x);
          id(uart_ctrl).write_str(out);
          ESP_LOGI("link", "sent: %s", body);
      - script.execute: update_ui

  # Highlights the menu entry of the open page. The PIN, Wi-Fi, parameters and
  # calibration pages belong to "Settings" (index 7). It also clears the
  # sensitive text fields: PIN and password do not stay in memory after leaving.
  - id: select_page
    mode: single
    parameters:
      idx: int
    then:
      - lambda: |-
          lv_obj_t *b[10] = { id(nav0), id(nav1), id(nav2), id(nav3), id(nav4),
                              id(nav5), id(nav6), id(nav7), id(nav8), id(nav9) };
          for (int i = 0; i < 10; i++) {
            lv_obj_set_style_bg_color(b[i],
              lv_color_hex(i == idx ? 0x2C3846 : 0x141A21), LV_PART_MAIN);
          }
          lv_textarea_set_text(id(ta_pin), "");
          lv_textarea_set_text(id(ta_pass), "");
      - script.execute: update_ui

  # --- screen: sleep and wake ---------------------------------------------------
  # The black cover in the top_layer intercepts touch: the touch that wakes the
  # panel is "eaten" by the cover and never reaches a button underneath. On a
  # panel that commands pumps and valves this is essential: waking up and
  # commanding must never be the same gesture.
  - id: wake
    mode: single
    then:
      - lambda: |-
          id(g_touch) = millis();
          id(g_sleep) = false;
          lv_obj_add_flag(id(cover_sleep), LV_OBJ_FLAG_HIDDEN);
          auto call = id(backlight).turn_on();
          call.set_brightness(id(g_lum) / 100.0f);
          call.set_transition_length(200);
          call.perform();

  # Called every second. With an active alarm the screen never turns off, and a
  # new alarm turns on a screen that was already off.
  - id: check_sleep
    mode: single
    then:
      - lambda: |-
          static int al_prev = 0;
          uint32_t now = millis();
          bool wake_up = false, go_off = false;
          if (id(g_sleep)) {
            if (id(g_al) > al_prev && !id(g_stale)) wake_up = true;
          } else if (id(g_timeout_s) > 0 && id(g_al) == 0 &&
                     (now - id(g_touch)) > (uint32_t) id(g_timeout_s) * 1000UL) {
            go_off = true;
          }
          al_prev = id(g_al);
          if (wake_up) {
            id(wake).execute();
          } else if (go_off) {
            id(g_sleep) = true;
            lv_obj_clear_flag(id(cover_sleep), LV_OBJ_FLAG_HIDDEN);
            auto call = id(backlight).turn_off();
            call.set_transition_length(300);
            call.perform();
          }

  # --- PIN for delicate actions -----------------------------------------------
  # action: 1 = Wi-Fi page, 2 = panel restart, 3 = parameters, 4 = calibration.
  - id: open_pin
    mode: single
    parameters:
      action: int
    then:
      - lambda: |-
          const bool en = id(g_lang) == 1;
          id(g_pin_action) = action;
          lv_textarea_set_text(id(ta_pin), "");
          lv_label_set_text(id(lbl_pin_result), "");
          if (action == 1)
            lv_label_set_text(id(lbl_pin_title), en
              ? "Enter the PIN to change the Wi-Fi network"
              : "Inserire il PIN per cambiare la rete Wi-Fi");
          else if (action == 3)
            lv_label_set_text(id(lbl_pin_title), en
              ? "Enter the PIN to change the plant parameters"
              : "Inserire il PIN per cambiare i parametri dell'impianto");
          else if (action == 4)
            lv_label_set_text(id(lbl_pin_title), en
              ? "Enter the PIN to calibrate the probes"
              : "Inserire il PIN per calibrare le sonde");
          else
            lv_label_set_text(id(lbl_pin_title), en
              ? "Enter the PIN to restart the panel"
              : "Inserire il PIN per riavviare il pannello");
      - lvgl.page.show: page_pin
      - script.execute:
          id: select_page
          idx: 7

  - id: confirm_pin
    mode: single
    then:
      - lambda: |-
          std::string p = lv_textarea_get_text(id(ta_pin));
          lv_textarea_set_text(id(ta_pin), "");
          if (p == "${settings_pin}") {
            id(g_pin_result) = id(g_pin_action);
          } else {
            id(g_pin_result) = 0;
            lv_label_set_text(id(lbl_pin_result),
                              id(g_lang) == 1 ? "Wrong PIN" : "PIN errato");
          }
      - if:
          condition:
            lambda: 'return id(g_pin_result) == 1;'
          then:
            - lambda: |-
                lv_textarea_set_text(id(ta_ssid), id(ts_ssid).state.c_str());
                lv_textarea_set_text(id(ta_pass), "");
                lv_textarea_set_password_mode(id(ta_pass), true);
                lv_keyboard_set_textarea(id(kb_wifi)->obj, id(ta_ssid));
            - lvgl.page.show: page_wifi
      - if:
          condition:
            lambda: 'return id(g_pin_result) == 3;'
          then:
            - lvgl.page.show: page_params
      - if:
          condition:
            lambda: 'return id(g_pin_result) == 4;'
          then:
            - lvgl.page.show: page_cal
      - if:
          condition:
            lambda: 'return id(g_pin_result) == 2;'
          then:
            - lambda: |-
                id(g_result) = id(g_lang) == 1 ? "Restarting the panel..."
                                               : "Riavvio del pannello...";
            - lvgl.page.show: page_settings
            - script.execute: update_ui
            - delay: 1000ms
            - lambda: 'App.safe_reboot();'

  # Saves the credentials with the same mechanism as the ESPHome captive portal
  # (they go to flash and are tried first) and restarts. If the new network does
  # not answer, the panel opens its fallback access point, and the UART link to
  # the control board keeps working: Wi-Fi is not in the safety path.
  - id: save_wifi
    mode: single
    then:
      - lambda: |-
          const bool en = id(g_lang) == 1;
          std::string s = lv_textarea_get_text(id(ta_ssid));
          std::string p = lv_textarea_get_text(id(ta_pass));
          if (s.empty()) {
            id(g_pin_result) = 0;
            id(g_result) = en ? "Enter the network name" : "Inserire il nome della rete";
          } else {
            wifi::global_wifi_component->save_wifi_sta(s, p);
            id(g_pin_result) = 9;
            id(g_result) = en ? "Wi-Fi saved, restarting..." : "Wi-Fi salvato, riavvio in corso...";
          }
          lv_textarea_set_text(id(ta_pass), "");
      - script.execute: update_ui
      - if:
          condition:
            lambda: 'return id(g_pin_result) == 9;'
          then:
            - delay: 1500ms
            - lambda: 'App.safe_reboot();'

  # --- plant parameters: +/- on the displayed value ------------------------------
  # The new value shows immediately (optimistic) and is sent to the control
  # board. The next P frame confirms it, or restores the true value if the board
  # refused it. For 1.5 s after an edit P frames do not touch the fields, so two
  # quick taps add up instead of overwriting each other.
  - id: adjust_param
    mode: queued
    parameters:
      key: string
      delta: float
    then:
      - lambda: |-
          float *cur = nullptr; float mn = 0, mx = 0; const char *fmt = "%.2f";
          if (key == "fp")      { cur = &id(g_p_fp); mn = 0;    mx = 100; }
          else if (key == "fc") { cur = &id(g_p_fc); mn = 0;    mx = 20;  }
          else if (key == "dp") { cur = &id(g_p_dp); mn = 0.05; mx = 2;   }
          else if (key == "do") { cur = &id(g_p_do); mn = 5;    mx = 300; fmt = "%.0f"; }
          else if (key == "fn") { cur = &id(g_p_fn); mn = 25;   mx = 50;  fmt = "%.1f"; }
          else if (key == "dl") { cur = &id(g_p_dl); mn = 0.1; mx = 3.0; }
          if (cur == nullptr) return;
          if (isnan(*cur) || !id(g_p_ok)) {
            id(g_result) = id(g_lang) == 1 ? "parameters not received yet"
                                           : "parametri non ancora ricevuti";
            return;
          }
          float x = *cur + delta;
          if (x < mn) x = mn;
          if (x > mx) x = mx;
          x = roundf(x * 100.0f) / 100.0f;
          *cur = x;
          id(g_p_t_edit) = millis();
          char v[40], b[24];
          snprintf(b, sizeof(b), fmt, x);
          snprintf(v, sizeof(v), "%s:%s", key.c_str(), b);
          id(send_command).execute("set", std::string(v));

  # Scheduler: one choice (dropdown or checkbox) -> update the value here
  # (optimistic) and send it to the control board with "set".
  # key: gpr program 0..3, gmo mode 0..2, gfv photovoltaic 0/1, gsh shock 0/1.
  - id: sched_set
    mode: queued
    parameters:
      key: string
      value: int
    then:
      - lambda: |-
          if (!id(g_g_ok)) {
            id(g_result) = id(g_lang) == 1 ? "schedule not received yet"
                                           : "programma non ancora ricevuto";
            return;
          }
          int *cur = nullptr; int hi = 0;
          if (key == "gpr") { cur = &id(g_g_pr); hi = 3; }
          else if (key == "gmo") { cur = &id(g_g_mo); hi = 2; }
          else if (key == "gfv") { cur = &id(g_g_fv); hi = 1; }
          else if (key == "gsh") { cur = &id(g_g_sh); hi = 1; }
          if (cur == nullptr || value < 0 || value > hi) return;
          *cur = value;
          id(g_g_t_edit) = millis();
          char v[24];
          snprintf(v, sizeof(v), "%s:%d", key.c_str(), value);
          id(send_command).execute("set", std::string(v));

  # Calibration: sends the chosen buffer to the control board. probe: 0 = pH, 1 = ORP.
  - id: cal_capture
    mode: queued
    parameters:
      probe: int
    then:
      - lambda: |-
          static const float bph[5] = { 4.00f, 6.86f, 7.00f, 9.18f, 10.00f };
          static const float bor[2] = { 225.0f, 470.0f };
          char v[16];
          if (probe == 0) {
            snprintf(v, sizeof(v), "%.2f", bph[id(g_cal_bp)]);
            id(send_command).execute("calp", std::string(v));
          } else {
            snprintf(v, sizeof(v), "%.0f", bor[id(g_cal_bo)]);
            id(send_command).execute("calo", std::string(v));
          }

