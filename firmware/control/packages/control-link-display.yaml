# =============================================================================
# SPB - control board: UART link to the display panel
#
#   GPIO15 TX -> display GPIO44 (header H3 pin 3, EX_RXD)
#   GPIO16 RX <- display GPIO43 (header H3 pin 4, EX_TXD)
#   common GND, 115200 8N1
#
#   On the display side the link is NOT on GPIO15/16: on the Waveshare panel
#   those two pins are the SP3485 RS-485 pair and are not available as TTL.
#   See docs/uart-protocol.md.
#
# Message format: see docs/uart-protocol.md
#   S|...|*XX\n   status, sent every 500 ms
#   P|...|*XX\n   parameters and calibration state, every 2 s (control-settings.yaml)
#   G|...|*XX\n   filtration schedule, every 2 s (control-schedule.yaml)
#   C|...|*XX\n   command received from the display
#   A|...|*XX\n   command reply (ok / err + reason, reasons in English)
#
# The checksum is the XOR of all characters before the asterisk (last '|'
# included), as two uppercase hex digits.
# =============================================================================

uart:
  - id: uart_panel
    tx_pin: GPIO15
    rx_pin: GPIO16
    baud_rate: 115200
    data_bits: 8
    parity: NONE
    stop_bits: 1
    rx_buffer_size: 512

globals:
  - id: rx_buf
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: commands_received
    type: int
    restore_value: false
    initial_value: '0'
  - id: commands_refused
    type: int
    restore_value: false
    initial_value: '0'

interval:
  # ---------------------------------------------------------------- status -> display
  - interval: 500ms
    then:
      - lambda: |-
          auto f = [](float v) -> float { return isnan(v) ? -999.0f : v; };
          const char *mo = id(selector_auto).state ? "A" : (id(selector_manual).state ? "M" : "0");
          char ev[5];
          ev[0] = id(ev1).state ? '1' : '0';
          ev[1] = id(ev2).state ? '1' : '0';
          ev[2] = id(ev3).state ? '1' : '0';
          ev[3] = id(ev4).state ? '1' : '0';
          ev[4] = 0;

          // the 13 dosing permissives, in order C01..C13: '1' = satisfied
          char cb[14];
          const bool cv[13] = {
            id(c01_pump).state, id(c02_main_flow).state, id(c03_cell_flow).state,
            id(c04_ph_valid).state, id(c05_orp_valid).state, id(c06_ph_agree).state,
            id(c07_orp_agree).state, id(c08_ph_cal).state, id(c09_orp_cal).state,
            id(c10_levels).state, id(c11_no_alarms).state, id(c12_not_backwashing).state,
            id(c13_selector_auto).state };
          for (int i = 0; i < 13; i++) cb[i] = cv[i] ? '1' : '0';
          cb[13] = 0;

          // local date and time of the board (SNTP) for the panel clock
          char dt[16] = "0";
          {
            auto tt = id(local_time).now();
            if (tt.is_valid()) snprintf(dt, sizeof(dt), "%04d%02d%02d%02d%02d",
              tt.year, tt.month, tt.day_of_month, tt.hour, tt.minute);
          }

          char body[500];
          snprintf(body, sizeof(body),
            "S|mo=%s|tv=%.1f|tc=%.1f|ph=%.2f|ps=%.2f|or=%.0f|os=%.0f|hz=%.1f|cu=%.1f"
            "|pu=%d|q1=%.1f|q2=%.1f|l1=%.0f|l2=%.0f|l3=%.0f|f1=%d|f2=%d|f3=%d"
            "|ev=%s|do=%d|cs=%.0f|al=%d|cb=%s|pa=%.2f|pb=%.2f|dd=%.2f|lc=%d|dt=%s|",
            mo,
            f(id(pool_temperature).state), -999.0f,
            f(id(ph_primary).state), f(id(ph_secondary).state),
            f(id(orp_primary).state), f(id(orp_secondary).state),
            f(id(vfd_frequency).state), f(id(vfd_current).state),
            id(pump_running).state ? 1 : 0,
            f(id(main_pulses).state), f(id(cell_pulses).state),
            f(id(tank1_level).state), f(id(tank2_level).state), f(id(tank3_level).state),
            id(tank1_float).state ? 1 : 0, id(tank2_float).state ? 1 : 0, id(tank3_float).state ? 1 : 0,
            ev,
            id(dosing_enabled).state ? 1 : 0,
            f(id(permissives_ok).state),
            id(active_alarms), cb,
            f(id(pressure_upstream).state), f(id(pressure_downstream).state), f(id(delta_p).state),
            id(backwash_advised).state ? 1 : 0, dt);

          uint8_t x = 0;
          for (const char *p = body; *p; p++) x ^= (uint8_t) *p;
          char out[520];
          snprintf(out, sizeof(out), "%s*%02X\n", body, x);
          id(uart_panel).write_str(out);

  # ---------------------------------------------------------------- commands <- display
  - interval: 50ms
    then:
      - lambda: |-
          while (id(uart_panel).available()) {
            uint8_t c;
            if (!id(uart_panel).read_byte(&c)) break;

            if (c != '\n' && c != '\r') {
              if (id(rx_buf).length() < 200) id(rx_buf) += (char) c;
              continue;
            }
            std::string msg = id(rx_buf);
            id(rx_buf).clear();
            if (msg.length() < 6 || msg[0] != 'C') continue;

            size_t st = msg.rfind('*');
            if (st == std::string::npos || st + 2 >= msg.length()) continue;
            uint8_t x = 0;
            for (size_t i = 0; i < st; i++) x ^= (uint8_t) msg[i];
            char chk[4];
            snprintf(chk, sizeof(chk), "%02X", x);
            if (msg.compare(st + 1, 2, chk) != 0) {
              ESP_LOGW("link", "bad checksum, message discarded: %s", msg.c_str());
              continue;
            }

            auto field = [&](const char *k) -> std::string {
              std::string key = std::string("|") + k + "=";
              size_t p = msg.find(key);
              if (p == std::string::npos) return std::string();
              p += key.length();
              size_t e = msg.find('|', p);
              if (e == std::string::npos || e > st) e = st;
              return msg.substr(p, e - p);
            };

            std::string n = field("n");
            std::string cmd = field("c");
            std::string val = field("v");
            id(commands_received) += 1;
            ESP_LOGI("link", "command n=%s c=%s v=%s", n.c_str(), cmd.c_str(), val.c_str());

            bool ok = false;
            std::string why;

            // --- common rejection rules -------------------------------------
            bool manual = id(selector_manual).state;
            bool zero = !id(selector_auto).state && !id(selector_manual).state;

            if (zero) {
              why = "selector in ZERO";
            } else if (id(in_backwash) && cmd != "back") {
              why = "procedure in progress";
            } else if (cmd == "pump") {
              if (!manual) { why = "selector not in MANUAL"; }
              else {
                // Stop = run command only. Writing 0 to the reference does not
                // work: below min_value (freq_min_hz) ESPHome discards the value.
                if (val == "1") {
                  auto call = id(vfd_setpoint).make_call();
                  call.set_value(id(p_freq_normal));
                  call.perform();
                  id(vfd_run).turn_on();
                } else {
                  id(vfd_run).turn_off();
                }
                ok = true;
              }
            } else if (cmd == "hz") {
              float hz = atof(val.c_str());
              if (hz < ${freq_min_hz} || hz > ${freq_max_hz}) { why = "frequency out of range"; }
              else {
                auto call = id(vfd_setpoint).make_call();
                call.set_value(hz);
                call.perform();
                ok = true;
              }
            } else if (cmd.rfind("ev", 0) == 0) {
              if (!manual) { why = "selector not in MANUAL"; }
              else {
                bool on = (val == "1");
                if (cmd == "ev1") { on ? id(ev1).turn_on() : id(ev1).turn_off(); ok = true; }
                else if (cmd == "ev2") { on ? id(ev2).turn_on() : id(ev2).turn_off(); ok = true; }
                else if (cmd == "ev3") { on ? id(ev3).turn_on() : id(ev3).turn_off(); ok = true; }
                else if (cmd == "ev4") { on ? id(ev4).turn_on() : id(ev4).turn_off(); ok = true; }
                else why = "unknown valve";
              }
            } else if (cmd == "filt") {
              if (!manual) { why = "selector not in MANUAL"; }
              else { (val == "1") ? id(filtration_relay).turn_on() : id(filtration_relay).turn_off(); ok = true; }
            } else if (cmd == "dosa" || cmd == "dosc" || cmd == "dosr") {
              int sec = atoi(val.c_str());
              if (!manual) { why = "selector not in MANUAL"; }
              else if (sec < 1 || sec > 60) { why = "duration out of range"; }
              else if (cmd == "dosa" && !id(tank1_float).state) { why = "acid tank empty"; }
              else if (cmd == "dosc" && !id(tank2_float).state) { why = "chlorine tank empty"; }
              else if (cmd == "dosr" && !id(tank3_float).state) { why = "reserve tank empty"; }
              else {
                if (cmd == "dosa") id(jog_acid)->execute(sec);
                else if (cmd == "dosc") id(jog_chlorine)->execute(sec);
                else id(jog_reserve)->execute(sec);
                ok = true;
              }
            } else if (cmd == "back") {
              if (!manual) { why = "selector not in MANUAL"; }
              else if (val == "1") { id(backwash)->execute(); ok = true; }
              else { id(backwash)->stop(); id(in_backwash) = false; ok = true; }
            } else if (cmd == "set") {
              // v = key:value. Ranges: see control-settings.yaml
              size_t sp = val.find(':');
              std::string key = (sp == std::string::npos) ? std::string() : val.substr(0, sp);
              char *endp = nullptr;
              float x = NAN;
              if (sp != std::string::npos) {
                const char *num = val.c_str() + sp + 1;
                x = strtof(num, &endp);
                if (endp == num) x = NAN;
              }
              if (isnan(x)) { why = "invalid value"; }
              else if (key == "fp") {
                if (x < 0.0f || x > 100.0f) why = "value out of range";
                else { id(p_flow_main) = x; ok = true; }
              } else if (key == "fc") {
                if (x < 0.0f || x > 20.0f) why = "value out of range";
                else { id(p_flow_cell) = x; ok = true; }
              } else if (key == "dp") {
                if (x < 0.05f || x > 2.0f) why = "value out of range";
                else { id(p_ph_mismatch) = x; ok = true; }
              } else if (key == "do") {
                if (x < 5.0f || x > 300.0f) why = "value out of range";
                else { id(p_orp_mismatch) = x; ok = true; }
              } else if (key == "fn") {
                if (x < ${freq_min_hz} || x > ${freq_max_hz}) why = "frequency out of range";
                else { id(p_freq_normal) = x; ok = true; }
              } else if (key == "dl") {
                if (x < 0.1f || x > 3.0f) why = "value out of range";
                else { id(p_dp_backwash) = x; ok = true; }
              } else if (key.size() == 3 && key[0] == 'g') {
                // filtration schedule (see control-schedule.yaml)
                int *dst = nullptr; int hi = 1439;
                if (key == "gpr") { dst = &id(sch_program); hi = 3; }
                else if (key == "gmo") { dst = &id(sch_mode); hi = 2; }
                else if (key == "gfv") { dst = &id(sch_pv); hi = 1; }
                else if (key == "gsh") { dst = &id(sch_shock); hi = 1; }
                else if (key == "gin") dst = &id(sch_start);
                else if (key == "gfi") dst = &id(sch_end);
                else if (key == "gvi") dst = &id(sch_pv_start);
                else if (key == "gvf") dst = &id(sch_pv_end);
                if (dst == nullptr) why = "unknown parameter";
                else if (x < 0.0f || x > (float) hi) why = "value out of range";
                else { *dst = (int) lroundf(x); ok = true; }
              } else {
                why = "unknown parameter";
              }
            } else if (cmd == "rst") {
              if (val != "par") { why = "unknown reset"; }
              else {
                id(p_flow_main) = ${flow_min_main};
                id(p_flow_cell) = ${flow_min_cell};
                id(p_ph_mismatch) = ${ph_disagreement_threshold};
                id(p_orp_mismatch) = ${orp_disagreement_threshold};
                id(p_freq_normal) = ${freq_normal_hz};
                id(p_dp_backwash) = ${dp_backwash_bar};
                ok = true;
              }
            } else if (cmd == "calc") {
              if (val == "p") { id(cal_ph_pending) = false; ok = true; }
              else if (val == "o") { id(cal_orp_pending) = false; ok = true; }
              else why = "unknown probe";
            } else if (cmd == "calp" || cmd == "calo") {
              // Two-point calibration. MANUAL only: with the probes in the buffer
              // the readings are fake and automatic dosing must not be able to use them.
              const bool isph = (cmd == "calp");
              char *endp = nullptr;
              float buf = strtof(val.c_str(), &endp);
              float vavg = isph ? id(v_ph_avg) : id(v_orp_avg);
              float vraw = isph ? id(ph_volt).state : id(orp_volt).state;
              if (!manual) { why = "selector not in MANUAL"; }
              else if (endp == val.c_str()) { why = "invalid buffer value"; }
              else if (isph ? (buf < 1.0f || buf > 13.0f) : (buf < -500.0f || buf > 1200.0f)) {
                why = "buffer out of range";
              } else if (isnan(vavg) || isnan(vraw)) { why = "probe has no reading"; }
              else if (fabsf(vraw - vavg) > ${cal_max_instab}) { why = "unstable reading"; }
              else {
                bool &pend = isph ? id(cal_ph_pending) : id(cal_orp_pending);
                float &pv = isph ? id(cal_ph_pv) : id(cal_orp_pv);
                float &pb = isph ? id(cal_ph_pb) : id(cal_orp_pb);
                uint32_t &pt = isph ? id(cal_ph_pt) : id(cal_orp_pt);
                uint32_t now = millis();
                if (pend && now - pt > 600000UL) pend = false;
                if (!pend) {
                  pend = true; pv = vavg; pb = buf; pt = now;
                  ok = true;                       // first point: nothing changes yet
                } else if (fabsf(buf - pb) < (isph ? 1.0f : 50.0f)) {
                  why = "buffer same as first point";
                } else if (fabsf(vavg - pv) < ${cal_min_dv}) {
                  why = "voltage same as first point";
                } else {
                  float m = (buf - pb) / (vavg - pv);
                  float q = buf - m * vavg;
                  float ref = isph ? ${cal_ph_slope_ref} : ${cal_orp_slope_ref};
                  float ratio = m / ref;              // < 0 if the sign is opposite
                  if (ratio < ${cal_slope_min} || ratio > ${cal_slope_max}) {
                    why = "abnormal slope";
                    pend = false;
                  } else {
                    if (isph) { id(cal_ph_slope) = m; id(cal_ph_offset) = q; id(cal_ph_valid) = true; }
                    else { id(cal_orp_slope) = m; id(cal_orp_offset) = q; id(cal_orp_valid) = true; }
                    pend = false;
                    ok = true;
                  }
                }
              }
            } else if (cmd == "ackal") {
              id(active_alarms) = 0;
              ok = true;
            } else {
              why = "unknown command";
            }

            if (!ok) id(commands_refused) += 1;

            char body[160];
            if (ok) snprintf(body, sizeof(body), "A|n=%s|r=ok|", n.c_str());
            else    snprintf(body, sizeof(body), "A|n=%s|r=err|w=%s|", n.c_str(), why.c_str());
            uint8_t xa = 0;
            for (const char *p = body; *p; p++) xa ^= (uint8_t) *p;
            char out[180];
            snprintf(out, sizeof(out), "%s*%02X\n", body, xa);
            id(uart_panel).write_str(out);

            // after a settings command the panel immediately receives the new values
            if (cmd == "set" || cmd == "rst" || cmd == "calp" || cmd == "calo" || cmd == "calc")
              id(send_params)->execute();
            if (cmd == "set") id(send_schedule)->execute();
          }

sensor:
  - platform: template
    name: "Commands received from panel"
    id: n_commands
    accuracy_decimals: 0
    update_interval: 60s
    lambda: 'return id(commands_received);'

  - platform: template
    name: "Commands refused"
    accuracy_decimals: 0
    update_interval: 60s
    lambda: 'return id(commands_refused);'
