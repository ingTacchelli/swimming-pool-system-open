<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 706" width="1240" height="706" font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
