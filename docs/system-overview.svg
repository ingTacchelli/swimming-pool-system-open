  <text x="904" y="291" font-size="10.5" fill="#5A6775" text-anchor="middle">115200</text>

  <!-- ============ PANEL ============ -->
  <rect x="930" y="200" width="286" height="246" rx="8" fill="#FFFFFF" stroke="#2A7F6F" stroke-width="1.8"/>
  <path d="M930 208 a8,8 0 0 1 8,-8 h270 a8,8 0 0 1 8,8 v22 h-286 z" fill="#2A7F6F"/>
  <text x="946" y="224" font-size="13" font-weight="600" fill="#FFFFFF">TOUCH PANEL</text>

  <text x="1073" y="256" font-size="12.5" font-weight="600" fill="#1F2933" text-anchor="middle">Waveshare 7B</text>
  <text x="1073" y="273" font-size="10.5" fill="#5A6775" text-anchor="middle">ESP32-S3 · 1024 × 600 · GT911</text>

  <rect x="952" y="288" width="242" height="96" rx="5" fill="#EAF5F2" stroke="#9FC9BE" stroke-width="1.2"/>
  <text x="1073" y="308" font-size="11.5" font-weight="600" fill="#1F2933" text-anchor="middle">ESPHome + LVGL · 7 pages</text>
  <text x="1073" y="326" font-size="10.5" fill="#5A6775" text-anchor="middle">home · filtration · chemistry</text>
  <text x="1073" y="340" font-size="10.5" fill="#5A6775" text-anchor="middle">valves · alarms · maintenance</text>
  <text x="1073" y="354" font-size="10.5" fill="#5A6775" text-anchor="middle">commands</text>
  <text x="1073" y="374" font-size="10.5" fill="#2A7F6F" text-anchor="middle" font-style="italic">it asks, it never decides</text>

  <text x="1073" y="406" font-size="10.5" fill="#5A6775" text-anchor="middle">no frame for 3 s → readings greyed</text>
  <text x="1073" y="420" font-size="10.5" fill="#5A6775" text-anchor="middle">out, link declared down,</text>
  <text x="1073" y="434" font-size="10.5" fill="#5A6775" text-anchor="middle">commands refused</text>

  <!-- ============ HOME ASSISTANT ============ -->
  <line x1="1073" y1="446" x2="1073" y2="488" stroke="#8A97A6" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="1085" y="472" font-size="10.5" fill="#5A6775">Wi-Fi</text>

  <rect x="930" y="490" width="286" height="92" rx="8" fill="#F0F2F5" stroke="#8A97A6" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="1073" y="516" font-size="12.5" font-weight="600" fill="#5A6775" text-anchor="middle">Home Assistant — optional</text>
  <text x="1073" y="536" font-size="10.5" fill="#5A6775" text-anchor="middle">remote access · push notifications</text>
  <text x="1073" y="550" font-size="10.5" fill="#5A6775" text-anchor="middle">long-term history</text>
  <text x="1073" y="570" font-size="10.5" fill="#5A6775" text-anchor="middle" font-style="italic">the plant runs without it</text>

  <text x="1216" y="688" font-size="10.5" fill="#8A97A6" text-anchor="end">Dashed = optional. The emergency chain is hardware and independent of all of this.</text>
